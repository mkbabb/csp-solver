# ci — PR + push gate matrix for the CSC411_HW2 monorepo (W0 build restoration).
#
# Authored for the LIVE workspace root = REPO ROOT (repo-root Cargo.toml is the
# Cargo workspace with members csp-solver + csp-solver/wasm — morph-core and
# wasm-morph excised to github.com/mkbabb/morph at the W12 window (see the
# pre-morph-excision tag). Edition 2024 + stable toolchain (T2-W1: the nightly pin
# was vestigial — rust-toolchain.toml at repo root pins channel=stable, MSRV 1.88,
# and every lane below installs `dtolnay/rust-toolchain@stable` accordingly). This
# re-applies the queens-smoke lane from the composed seed (kernel-soundness-closure
# §6) and adds the full campaign-amended gate set from the W0 lane table
# (docs/tranches/2026-07-grand-uplift/waves/W0-build-restoration.md).
#
# NOTE on workspace-root adaptation: the seed workflow was written for csp-solver/
# as the Cargo root, so its cargo commands ran there. Here the workspace root is the
# REPO ROOT — cargo runs at repo root, and the queens bench needs `-p csp-solver`
# because the benches live in the csp-solver package.
#
# Lane → job map (W0 lane table; provenance cited per step; T3 grew the rust,
# py-runtime, and frontend jobs with the gac-ab/corpus-spine smokes, stubtest +
# tripwire, and knip; T4-W2 added the eslint boundary lane, promoted knip to
# error-level, and re-cut the flat fan-out into a compute-cost DAG; T4-W5 added
# the cargo-audit advisory tripwire; T5-W1 added lanes 12-18, every one of them a
# gate the audit found absent, unwired, or scope-narrowed) — the lane set rides
# EIGHTEEN jobs (the rust job carries lanes 2 + 3):
#   0.  build-lean-wasm    -> build-lean-wasm (the SHIP lean artifact built ONCE,
#                                         uploaded as `lean-wasm-pkg`; frontend +
#                                         e2e + twiggy(lean half) `needs:` it and
#                                         download — kills 2 redundant lean builds
#                                         + the Rust toolchain in frontend/e2e)
#   1.  fmt + clippy       -> lint       (clippy -D warnings, strict, no continue-on-error;
#       + the inline-test law             + T7-W6's inline-test law — no test attribute
#                                         under any member's src/, self-tested)
#   2.  build + test       -> rust       (cargo build/test --workspace — NEVER per-crate)
#   3.  bench + corpus smoke-> rust      (queens assert_eq!(92/14200); gac_ab --test;
#                                         gac_ab_corpus 0/50 false-UNSAT + 4,153,388→8,222
#                                         node-count spine — T3-W6 ROW-3a/3d, re-minted
#                                         at the T4-W6 bank re-cut; +T4-W6
#                                         generation-truth: zzz_gen_truth_probe 16×16
#                                         monotone + verify_bank_uniqueness de-orphaned)
#   4.  py compile         -> py-compile (cargo check --features py under Python 3.13 — pyo3 0.29-tested floor, not a hard ceiling)
#   5.  py runtime         -> py-runtime (maturin wheel -> uv venv -> pytest in csp-solver/tests-py)
#   6.  wasm               -> wasm       (wasm-pack test --node + clippy --target wasm32)
#   7.  twiggy budgets     -> twiggy     (full module fail>240 KB / warn>230 KB; lean
#                                         half downloads the shared ship artifact)
#   8.  frontend           -> frontend   (download lean pkg; npm ci --dry-run; npm ci;
#                                         vue-tsc --noEmit; eslint boundary rig; knip)
#   9.  e2e                -> e2e        (download lean pkg -> Playwright over the Vue SPA)
#   10. iai                -> iai        (callgrind deterministic instruction-count baseline)
#   11. cargo-audit        -> cargo-audit(RustSec advisory scan over Cargo.lock; independent, no needs:)
#   12. FE unit estate     -> fe-unit    (T5-W1.1/1.14: vitest run + the >=300 executed
#                                         count floor + the per-scope coverage floor,
#                                         all off ONE instrumented vitest invocation)
#   13. boundary law       -> boundary   (T5-W1.4: the generated 20/20 cross-game matrix,
#                                         GREEN since T5-W2 2.5; carries the generator's
#                                         vacuity canary, which `eslint .` cannot)
#   14. perf subset        -> perf-subset(T5-W1.2: the P1 patch's gates.json idle
#                                         thresholds, executed on the built dist)
#   15. wasm resolution    -> wasm-publish-dryrun
#                                        (T5-W1.12: the pkg exports contract + a
#                                         no-token `npm publish --dry-run`)
#   16. evidence policy    -> evidence-policy
#                                        (T5-W1.3: per-image + per-wave byte caps over
#                                         docs/tranches/**, self-tested)
#   17. doc truth          -> doc-truth  (T5-W0.2 + W1.7, widened at T7-W0: every figure
#                                         re-derived from the tree at run time)
#   18. npm advisories     -> npm-audit  (T5-W1.15: high+ over the frontend lockfile —
#                                         the oracle the Dependabot dashboard is not)
#
# Compute-cost DAG (T4-W2, r4-corrected — a `needs:` saves redundant CI minutes,
# NOT wall-time; a predecessor serializes onto each dependent's critical path, so
# edges are added ONLY where they kill redundant compute without lengthening the
# critical path): build-lean-wasm ← {frontend, e2e, twiggy, fe-unit, boundary,
# perf-subset, wasm-publish-dryrun, doc-truth}. The five T5-W1 additions take that
# edge for one reason only: web/frontend/package.json file:-links
# @mkbabb/csp-solver-wasm to csp-solver/wasm/pkg, so `npm ci` cannot resolve the
# lockfile until that directory exists — they DOWNLOAD the shared artifact rather
# than rebuild it, and carry no Rust toolchain. lint/rust/py-*/wasm/iai stay
# independent (they consume no wasm artifact), and so do T5-W1's two tree-only
# lanes — evidence-policy and npm-audit read the checkout and nothing else.
# W5's cargo-audit (landed, no `needs:`) slots in the same way (no
# lint-before-build gate: it would only lengthen the build-lean-wasm critical
# path).
#
# Build posture (STANDING, per the T15 refutation — synthesis-pass3.md §1 #14):
# default release profile retained. NO lto=fat, NO codegen-units=1, NO strip
# anywhere in CI — the 10-25% claim was load-average-50 contention noise; on a
# quiet host lto=fat+cu=1+strip alone is +16-17% slower and the package nets ~=0%.
# The wheel lane (py-runtime) builds `maturin build --release` — the DEFAULT
# release profile, no extra tuning (T15 rejects lto=fat/cu=1/strip, not
# `--release` itself). A dev-profile wheel cannot clear the suite's <50ms
# solve-time assertions (test_bench_compare.py — ~102-112ms observed on a
# dev-profile Golden Nugget solve, W1 gate-py finding F2). Honest cost: the
# measured +36-40% cold cargo-build wall-time penalty (synthesis-pass3.md's
# release-profile cold-build note) now DOES apply to this lane's build step —
# accepted so the perf-threshold tests are meaningful instead of vacuous.
name: ci

on:
    pull_request:
        branches: [main, master]
    push:
        branches: [main, master]

jobs:
    # ---------------------------------------------------------------- Lane 1
    # fmt + clippy + the inline-test law. Kept in a job of its own so a red clippy
    # does NOT mask the build/test/queens signal. Strict, no continue-on-error.
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: fmt
              run: cargo fmt --all --check
            - name: clippy (-D warnings, workspace, all targets)
              run: cargo clippy --workspace --all-targets -- -D warnings
            # T7-W6 (T7-R01) — THE INLINE-TEST LAW. `csp-solver/src/builder/kuhn_munkres.rs`
            # carried a `#[cfg(test)] mod tests` born 19 hours after T2 declared the estate free
            # of them, and nothing in CI read the surface: `cargo test` runs an inline module
            # exactly as happily as an integration one, so the breach was invisible to every
            # green. The tests moved one directory over — `csp-solver/tests/kuhn_munkres.rs`,
            # same five names, same numbers, the U-09 precedent — and this gate keeps the door
            # shut: no test attribute under any workspace member's `src/`, in any spelling
            # (`#[cfg(test)]`, `#[cfg(all(test, …))]`, a bare `#[test]`, `#[wasm_bindgen_test]`).
            # There is no waiver list.
            #
            # `--self-test` runs 10 synthetic cases BEFORE the real audit — seven that must red,
            # three negative controls that must not (prose naming the attribute,
            # `#[cfg(feature = "test")]`, `#[cfg_attr(test, …)]`) — and an empty scope THROWS
            # rather than reading as a clean tree. A gate that cannot fail is not a gate; a gate
            # that reads zero files is worse. Born RED at af508288 on six attributes
            # (evidence/w6/inline-test-born-red.txt); green after the cut, with the ablation
            # re-run on the live tree (evidence/w6/inline-test-green-and-ablation.txt).
            #
            # It rides THIS lane because it is a static, zero-dependency read of the Rust source
            # — the same species as fmt and clippy — and needs no cargo, no target dir, no cache.
            # Node is set up for it alone, after the two cargo steps so a Node install never
            # delays a clippy red.
            - name: Set up Node (LTS) for the inline-test gate
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - name: inline-test law (no test attribute under any member's src/, self-tested)
              run: node scripts/check-inline-tests.mjs --self-test

    # ---------------------------------------------------------------- Lanes 2 + 3
    # build + test + queens-bench smoke. --workspace only, NEVER per-crate: the
    # wasm SolveConfig E0063 break was invisible to per-crate tests
    # (synthesis-pass3.md §1 T5 amendment 4).
    rust:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: build (workspace)
              run: cargo build --workspace
            - name: test (workspace)
              run: cargo test --workspace
            - name: queens-bench smoke (ground-truth solution-count asserts)
              # criterion --test mode runs each bench closure once, executing the
              # embedded assert_eq!(solutions.len(), 92 / 14200) checks that
              # `cargo test` structurally cannot see. The ONLY CI lane that sees
              # those assertions — guards the AC-3/MAC enumerate-continuation
              # soundness regression (kernel-soundness-closure.md §6). `-p csp-solver`
              # because the benches live in the csp-solver package.
              run: cargo bench -p csp-solver --bench queens -- --test
            - name: gac-ab bench smoke (GAC on/off closures run once)
              # The T3-W6 ROW-3a per-call-cost A/B bench, exercised in criterion
              # --test mode: runs each GAC on/off closure once and fires its
              # `assert!(!solutions.is_empty())` so a build that stops solving under
              # either GAC state fails here, not silently at measurement time.
              run: cargo bench -p csp-solver --bench gac_ab -- --test
            - name: GAC corpus node-count smoke (0/50 false-UNSAT + 4,153,388→8,222 spine)
              # T3-W6 ROW-3d: promotes examples/gac_ab_corpus from a hand-run probe
              # to a CI gate. Release build (the corpus is heavy — the hard 9×9 boards
              # dominate; a dev build would thrash the timeout). Two asserts, both
              # exit-non-zero: (a) zero false-UNSAT across GAC off AND on over the 50
              # known-solvable boards under the exact production config (Ac3+Mrv), and
              # (b) the deterministic search-node spine — GAC off→on totalling
              # 4,153,388→8,222 (re-minted at T4-W6's 16×16 Hard bank re-cut; the T3
              # spine 40,513→4,678 rode the stale bank) — holds. Node counts are a
              # pure function of the algorithm
              # (invariant across machine + load, unlike the wall ratio, G6), so this
              # is the soundness+cost oracle guarding every future GAC edit. `-p
              # csp-solver` because the example lives in that package.
              run: cargo run -p csp-solver --release --example gac_ab_corpus
            - name: generation-truth probe (GEN-1 16×16 monotone; T4-W6)
              # T4-W6 ROW-2: the generation-truth gate. Grades the embedded Sudoku
              # bank by measure_difficulty (FC + FailFirst, the codebase's own
              # difficulty proxy) under a node budget and asserts the tier labels
              # order honestly — median AND max capped-backtracks and the deep-search
              # fraction non-decreasing easy→medium→hard, givens non-increasing, and
              # 16×16 Hard deep-searching on a majority of deals. Born RED at the wave
              # base SHA (the 16×16 Hard bank was stale: 102-107 givens / 0 backtracks
              # while Medium ran to millions — Hard measured easier than Medium); cured
              # by regenerating the Hard bank (disposition (a)). Release (a search-hard
              # 16×16 grade runs to ~1.5M backtracks; the budget bounds it).
              run: cargo run -p csp-solver --release --example zzz_gen_truth_probe
            - name: bank uniqueness sweep (GEN-4 verify_bank_uniqueness; T4-W6)
              # T4-W6 ROW-5: de-orphans examples/verify_bank_uniqueness — it re-solves
              # every embedded template with max_solutions:2 and exit-non-zero on any
              # non-unique / unsat / budget-truncated board. Previously in NO CI lane
              # (FAM-1 orphaned-gate, generation edition — a corrupt data/ template
              # passed CI); now a standing gate beside the live-gen sweep in
              # tests/sudoku_generate.rs. Release (the corpus re-solve is heavy).
              run: cargo run -p csp-solver --release --example verify_bank_uniqueness

    # ---------------------------------------------------------------- Lane 4
    # py compile — the historical break class (Pass-1 N1). `cargo check --features py`
    # under Python 3.13: T2-W1's pyo3 0.24 -> 0.29 bump lifted the 0.24-era 3.13
    # ceiling (0.29 is tested through 3.14.0 final upstream) — 3.13 below is now a
    # tested-floor pin, not a hard cap (kernel-soundness-closure.md §7.6 is
    # superseded by the pyo3 0.29 migration note).
    py-compile:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - name: Pin Python 3.13 (pyo3 0.29-tested floor)
              id: setup-python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
            - name: Install Rust stable toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-pycompile-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: cargo check --features py
              # Point PyO3's build script at the pinned 3.13 interpreter explicitly
              # (fail-explicit: pin the tested floor rather than letting a stray host
              # Python get discovered — pyo3 0.29 itself now supports up to 3.14).
              env:
                  PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
              run: cargo check -p csp-solver --features py

    # ---------------------------------------------------------------- Lane 5
    # py runtime — the runtime gate for typed exceptions and GIL probes;
    # compile-check alone is insufficient (kernel-soundness-closure.md §7.6). Builds
    # the csp_solver wheel with maturin (config lives in csp-solver/pyproject.toml —
    # module csp_solver, features ["py"]), installs it into the csp-solver/tests-py
    # uv venv, runs pytest (carries the wheel-contract + panic-contract tests: unwind
    # -> PanicException catchable; forced abort -> SIGABRT negative control — self-
    # contained under csp-solver/tests-py, pytest.importorskip("csp_solver") + stdlib
    # only). `--release` (default release profile, no lto=fat/cu=1/
    # strip tuning — T15 only rejects that tuning, not `--release` itself; W1
    # py-closure gate finding F2: a dev-profile wheel fails the suite's <50ms
    # solve-time assertions, ~102-112ms observed on Golden Nugget). Accept the
    # measured +36-40% cold cargo-build wall-time penalty for this lane in
    # exchange for perf assertions that mean something.
    py-runtime:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - name: Pin Python 3.13 (pyo3 0.29-tested floor)
              id: setup-python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
            - name: Install Rust stable toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Install uv
              uses: astral-sh/setup-uv@v4
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-pyruntime-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: Stub auto-detection tripwire (module-name == stub stem)
              # maturin ships the stub + py.typed ONLY when the root
              # `<module-name>.pyi` stem equals `[tool.maturin] module-name`. A
              # rename of either silently drops both from the wheel with NO build
              # error — an untyped wheel ships green. Assert the invariant before
              # the build so the drop fails loud here (P2-L4 §5).
              run: |
                  mod=$(sed -nE 's/^module-name = "([^"]+)".*/\1/p' csp-solver/pyproject.toml)
                  test -f "csp-solver/${mod}.pyi" || {
                    echo "::error::stub csp-solver/${mod}.pyi missing — maturin would ship an untyped wheel"; exit 1;
                  }
                  echo "stub-stem OK: module-name='${mod}' == csp-solver/${mod}.pyi"
            - name: Build csp_solver wheel (maturin --release; default release profile, no extra tuning)
              # --interpreter + PYO3_PYTHON both pin the pinned 3.13 ABI explicitly.
              env:
                  PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
              run: |
                  # The cargo cache restores target/wheels/ with prior-version
                  # wheels; the install step's unqualified *.whl glob must match
                  # exactly one — clean before building (T3-W2 CI fix: 0.2.0 +
                  # 0.3.0 coexisting broke uv with conflicting URLs).
                  rm -rf target/wheels
                  uvx --from 'maturin>=1.0,<2.0' maturin build \
                    --release \
                    --manifest-path csp-solver/Cargo.toml \
                    --interpreter '${{ steps.setup-python.outputs.python-path }}' \
                    --out target/wheels
            - name: Sync test-harness venv (csp-solver/tests-py, dev extras)
              working-directory: csp-solver/tests-py
              # PEP 735 [dependency-groups]; uv installs the `dev` group by default —
              # plain sync is the correct invocation.
              run: uv sync
            - name: Install csp_solver wheel into the test-harness venv
              working-directory: csp-solver/tests-py
              run: uv pip install ../../target/wheels/*.whl
            - name: pytest (csp-solver/tests-py, against the installed wheel)
              # --no-sync so `uv run` does not re-resolve the venv and evict the
              # manually-installed csp_solver wheel (it isn't a declared dependency).
              working-directory: csp-solver/tests-py
              run: uv run --no-sync pytest
            - name: stubtest (csp_solver stub vs installed wheel, flag-free)
              # Flag-free (NOT --ignore-missing-stub) so surface GROWTH — a new
              # runtime class/function/exception the stub lacks — also fails loud;
              # the one-line stubtest_allowlist.txt suppresses ONLY maturin's
              # private `csp_solver.csp_solver` submodule. Expect: "Success: no
              # issues found in 2 modules". mypy>=1.11 rides the tests-py dev group.
              working-directory: csp-solver/tests-py
              run: uv run --no-sync python -m mypy.stubtest csp_solver --allowlist stubtest_allowlist.txt

    # ---------------------------------------------------------------- Lane 6
    # wasm — wasm-pack test --node on csp-solver/wasm (morph excised to its own
    # repo at W12; its wasm tests travel with it — morph-excision-spec.md
    # risks), plus clippy --target wasm32-unknown-unknown for BOTH wasm crates.
    wasm:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain (+ wasm32 target, clippy)
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
                  components: clippy
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            # The legacy installer script serves <0.14, which forwards --profile to
            # cargo alongside its implicit --release and dies — pin via taiki-e.
            - name: Install wasm-pack (>=0.14 floor — D9 three-file atomicity)
              uses: taiki-e/install-action@v2
              with:
                  tool: wasm-pack
            - name: wasm-pack test --node (csp-solver/wasm only)
              run: wasm-pack test --node csp-solver/wasm
            - name: clippy --target wasm32 (csp-solver-wasm)
              run: cargo clippy -p csp-solver-wasm --target wasm32-unknown-unknown -- -D warnings

    # ---------------------------------------------------------------- Lane 0
    # build-lean-wasm — the compute-cost DAG predecessor (T4-W2, r4). Builds the
    # LEAN deploy artifact ONCE with the EXACT ship recipe (byte-for-byte the same
    # command the frontend + e2e lanes each ran independently: `--target web
    # --profile wasm-release --no-default-features` — sudoku + futoshiki surface,
    # the assignment feature compiled out) and uploads `csp-solver/wasm/pkg` as
    # `lean-wasm-pkg`. frontend, e2e, and twiggy's lean half `needs:` this and
    # DOWNLOAD it instead of each rebuilding — killing 2 redundant lean builds and
    # the Rust toolchain + wasm-pack install in the (now Node-only) frontend + e2e
    # jobs. Framing is COMPUTE COST, not wall-time (r4): this serializes onto the
    # frontend/e2e/twiggy critical path, but the build is cheap and the duplicated
    # compute it removes is the win.
    build-lean-wasm:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain (wasm32)
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            - name: Install wasm-pack (>=0.14 floor)
              uses: taiki-e/install-action@v2
              with:
                  tool: wasm-pack
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-build-lean-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: Build the lean wasm artifact (EXACT ship recipe — the package.json file-link target)
              run: wasm-pack build csp-solver/wasm --scope mkbabb --target web --profile wasm-release --no-default-features
            # T5-W1 row 1.12 (audit I3/N2). `make wasm` runs this postprocess; this
            # lane calls wasm-pack DIRECTLY and then uploads pkg/ as the artifact
            # frontend, e2e, twiggy, fe-unit, boundary, perf-subset, doc-truth and
            # wasm-publish-dryrun all download. Without it CI's artifact would carry a
            # DIFFERENT resolution contract than the one `npm run build` mints locally,
            # and every downstream lane would be testing the wrong package. Node is not
            # otherwise installed in this job, so setup-node comes first.
            - name: Set up Node (for the pkg-exports postprocess)
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - name: Stamp the pkg exports map (the generator owns the resolution contract)
              run: node csp-solver/wasm/scripts/pkg-exports.mjs --write
            - name: Upload the lean wasm pkg (shared by frontend + e2e + twiggy)
              uses: actions/upload-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: csp-solver/wasm/pkg
                  if-no-files-found: error
                  retention-days: 1

    # ---------------------------------------------------------------- Lane 7
    # twiggy budgets — measured artifact bands (Pass-2 prototype 6). Full module
    # FAIL >240 KB / WARN >230 KB on the raw .wasm (decimal KB, matching prototype
    # 6's "92,897 B raw ~= 93 KB" convention). The five-game lean budget (127,500 B,
    # the same ~2.6%-headroom draw over the runner-measured artifact) is enforced
    # below on the --no-default-features build (the five puzzle families, the
    # assignment feature and its serde graph compiled out).
    twiggy:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        needs: [build-lean-wasm]
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain (+ wasm32 target)
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-twiggy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: Install wasm-pack (>=0.14 floor — see the wasm job note)
              uses: taiki-e/install-action@v2
              with:
                  tool: wasm-pack
            - name: Install twiggy (binary cache)
              uses: taiki-e/install-action@v2
              with:
                  tool: twiggy
            # --profile wasm-release is REQUIRED: plain release measured
            # 270,179 B at T2, over the 240 KB fail budget. wasm-release is the
            # workspace-root profile (opt-level=z, panic=abort) the budgets below
            # were drawn for. No current size is restamped in this comment: a
            # hand-copied measurement rots in place, and this one carried the
            # T2-WGATE pair as "current" through four closes. Both run steps
            # print the size they actually measured; the last full-module figure
            # of record is 227,385 B, measured by this lane on the runner at the
            # d70073f3 gate, inside both bands. The full/lean delta, which does
            # not rot: the assignment Hungarian dispatch consumes the hungarian
            # crate, whose transitive ndarray grows the DEFAULT-feature module
            # (+10,242 B at the T2 measure); the deployed lean artifact excludes
            # assignment entirely. Dated re-measure log, historical only:
            #   222,436 B full / 90,602 B lean (T2-WGATE full, T2-W7 lean —
            #   the latter +2,839 B over T2-W3's 87,763 B from the W6 beat-9
            #   propagate ops, which ride the full module too, +1,882 B)
            #   210,312 B full / 87,475 B lean (T2-W1 re-measure on stable +
            #   wasm-bindgen 0.2.126, dtolnay/rust-toolchain@stable, this tree;
            #   supersedes the W6 gate record of 211,639 B full / 87,853 B lean —
            #   both bands hold with headroom, no rationale change needed)
            - name: wasm-pack build (full module)
              run: wasm-pack build csp-solver/wasm --scope mkbabb --profile wasm-release
            - name: twiggy top + raw-size budget (fail >240 KB / warn >230 KB)
              run: |
                  set -euo pipefail
                  WASM=csp-solver/wasm/pkg/csp_solver_wasm_bg.wasm
                  test -f "$WASM" || { echo "::error::$WASM not produced by wasm-pack build"; exit 1; }
                  twiggy top -n 25 "$WASM" || true
                  RAW=$(wc -c < "$WASM")
                  echo "full module raw size: ${RAW} B"
                  if [ "$RAW" -gt 240000 ]; then
                    echo "::error::wasm full module ${RAW} B exceeds the 240 KB fail budget"
                    exit 1
                  elif [ "$RAW" -gt 230000 ]; then
                    echo "::warning::wasm full module ${RAW} B exceeds the 230 KB warn threshold"
                  fi
            # Lean deploy artifact (W6): sudoku + futoshiki surface, the assignment
            # feature compiled out — the module the frontend Worker actually ships.
            # T4-W2 compute-cost DAG: DOWNLOAD the shared ship artifact (built once
            # in build-lean-wasm) instead of rebuilding the lean half here. It lands
            # in a distinct dir (lean-pkg/) so the full-module pkg measured above is
            # not clobbered.
            - name: Download the shared lean wasm pkg
              uses: actions/download-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: lean-pkg
            - name: lean raw-size budget (fail >127,500 B)
              # Measures the EXACT ship artifact (`--target web` lean build, shared
              # from build-lean-wasm) — twiggy previously rebuilt the lean half on
              # the bundler-default target as a proxy; it now measures the bytes the
              # frontend actually ships. Band re-derived for the FIVE-game wasm:
              # the old 93,000 B ceiling was drawn for two games; each game pays a
              # wire surface (solve/generate/propagate entry fns + result structs +
              # wasm-bindgen glue, measured ~9.4–10.2 KB/game at the thermo/killer/
              # kenken landings; the cage constraints themselves cost +2,608 B).
              # Ceiling drawn by the band's original convention — ~2.6% headroom
              # over the RUNNER-measured artifact (90,602→93,000 was the same draw):
              # runner measures 122,861 B at f2ae188d, run 30722381389 (darwin
              # measures 121,137 B at a3ada202; toolchain delta measured +1,724 B — both
              # halves re-measured this tranche) → fail >127,500 B. The band stays
              # put while the artifact moves; the run step prints what it measured.
              # A wire-dedup refactor banks with re-trigger: a sixth game, or any
              # single wire >12 KB.
              run: |
                  set -euo pipefail
                  WASM=lean-pkg/csp_solver_wasm_bg.wasm
                  test -f "$WASM" || { echo "::error::$WASM missing from the lean-wasm-pkg artifact"; exit 1; }
                  RAW=$(wc -c < "$WASM")
                  echo "lean artifact raw size: ${RAW} B (runner-measured 122,861 B; fail >127,500)"
                  if [ "$RAW" -gt 127500 ]; then
                    echo "::error::lean wasm artifact ${RAW} B exceeds the 127,500 B five-game band"
                    exit 1
                  fi

    # ---------------------------------------------------------------- Lane 15
    # wasm-publish-dryrun — the pkg's RESOLUTION contract (T5-W1 row 1.12, audit
    # I3 NARROWED / N2).
    #
    # csp-solver/wasm/pkg/package.json is gitignored and minted wholesale by
    # wasm-pack. Five production workers deep-import
    # `@mkbabb/csp-solver-wasm/csp_solver_wasm_bg.wasm?url`, which today resolves
    # ONLY through Node's legacy no-`exports` fallback. The day a wasm-pack release
    # begins emitting an `exports` map without a `.wasm` row, all five workers die
    # on ERR_PACKAGE_PATH_NOT_EXPORTED — with zero source change, zero diff to
    # review, and nothing watching. The contract now lives in
    # csp-solver/wasm/scripts/pkg-exports.mjs: `--write` stamps it onto the
    # artifact (build-lean-wasm, above), `--check` reads the same constant
    # backwards, so gate and postprocess cannot drift.
    #
    # It gates the SHIPPED artifact: it DOWNLOADS the very pkg the other lanes
    # consume rather than rebuilding its own.
    #
    # NO SECRET, EVER. `npm publish --dry-run` exits 0 on an unauthenticated runner
    # (it warns and stops before the PUT) — proven in evidence/w1/publish-dryrun.txt
    # §6. Do NOT add NODE_AUTH_TOKEN to this job; it must not be able to publish.
    wasm-publish-dryrun:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [build-lean-wasm]
        steps:
            - uses: actions/checkout@v4
            - name: Download the lean wasm pkg (the exact artifact frontend + e2e consume)
              uses: actions/download-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: csp-solver/wasm/pkg
            - name: Set up Node (LTS)
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
            # npm 10 mis-resolves this repo's lockfiles; the pack/publish surface is
            # pinned to the same floor every other Node lane uses.
            - name: Pin npm >=11
              run: npm install -g npm@^11
            # Exact-map assertion + a live import.meta.resolve of every declared
            # subpath through a throwaway node_modules link. Reds on a MISSING row
            # (the N2 drift) and on an UNDECLARED extra row (silent surface growth).
            - name: pkg exports contract (--check)
              run: node csp-solver/wasm/scripts/pkg-exports.mjs --check
            # The publish path itself. --dry-run runs the whole flow except the final
            # PUT; no token, no registry write, no publish capability in this job.
            - name: npm publish --dry-run (NO publish)
              working-directory: csp-solver/wasm/pkg
              run: npm publish --dry-run
            # Resolution as a REGISTRY CONSUMER receives it: pack the tarball, unpack
            # it into a throwaway node_modules, resolve the workers' subpath from
            # there. Packing can drop a file the working directory still has (`files`
            # is its own surface) — only the tarball proves what a consumer gets.
            - name: Resolve the workers' subpath from the packed tarball
              run: |
                  set -euo pipefail
                  SB="$(mktemp -d)"
                  mkdir -p "$SB/node_modules/@mkbabb/csp-solver-wasm"
                  npm pack ./csp-solver/wasm/pkg --pack-destination "$SB" >/dev/null
                  tar -xzf "$SB"/*.tgz -C "$SB/node_modules/@mkbabb/csp-solver-wasm" --strip-components=1
                  cd "$SB"
                  node --input-type=module -e '
                    const want = [
                      "@mkbabb/csp-solver-wasm",
                      "@mkbabb/csp-solver-wasm/csp_solver_wasm_bg.wasm",
                      "@mkbabb/csp-solver-wasm/package.json",
                    ];
                    let bad = 0;
                    for (const s of want) {
                      try { console.log("OK  ", s, "->", import.meta.resolve(s)); }
                      catch (e) { console.log("FAIL", s, "->", e.code); bad++; }
                    }
                    process.exit(bad ? 1 : 0);
                  '
            # The byte band, re-derived on the artifact THIS job holds. Duplicated
            # from twiggy on purpose: twiggy measures its own download, and a regen
            # that changed the postprocess must not slip a fat binary past this lane
            # just because the other one happened to pass.
            - name: lean raw-size band (fail >127,500 B)
              run: |
                  set -euo pipefail
                  RAW=$(stat -c%s csp-solver/wasm/pkg/csp_solver_wasm_bg.wasm)
                  echo "lean artifact raw size: ${RAW} B (darwin measures 121,137 B at T5-W2; fail >127,500)"
                  if [ "$RAW" -gt 127500 ]; then
                    echo "::error::lean wasm artifact ${RAW} B exceeds the 127,500 B five-game band"
                    exit 1
                  fi

    # ---------------------------------------------------------------- Lane 8
    # frontend — npm ci --dry-run (EUSAGE was P0, Pass-2 prototype 8) then npm ci +
    # vue-tsc --noEmit + eslint boundary rig + knip. @mkbabb/csp-solver-wasm is a
    # monorepo file: link to the gitignored csp-solver/wasm/pkg build output (the
    # LEAN artifact — consuming the published full-featured registry package would
    # regress the lean band). T4-W2 compute-cost DAG: instead of rebuilding that
    # artifact, this lane `needs:` build-lean-wasm and DOWNLOADS it — so there is no
    # Rust toolchain / wasm-pack / cargo cache here at all (the lane is Node-only).
    frontend:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [build-lean-wasm]
        steps:
            - uses: actions/checkout@v4
            - name: Download the lean wasm pkg (the package.json file-link target)
              uses: actions/download-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: csp-solver/wasm/pkg
            - name: Set up Node (LTS) with npm cache
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: web/frontend/package-lock.json
            # Node 24 ships npm 11.x already, but pin explicitly: older Node's npm 10
            # mis-resolves the lockfile.
            - name: Pin npm >=11
              run: npm install -g npm@^11
            - name: npm ci --dry-run (lockfile integrity gate)
              working-directory: web/frontend
              run: npm ci --dry-run
            - name: npm ci
              working-directory: web/frontend
              run: npm ci
            - name: vue-tsc --noEmit
              working-directory: web/frontend
              run: npx vue-tsc --noEmit
            # eslint — the colocation boundary rig (T4-W2, eslint.config.js): pencil↮games, the
            # 3-level pencil-depth rule, and — IMPORTED from `eslint.boundary.config.js` since
            # T5-W2 2.5 — the GENERATED cross-game matrix: all 20/20 ordered pairs plus the
            # shared floor (`games/shared` may not import a game). The hand-spelled pair this
            # line used to name enforced 2 of 20; thermo, killer and kenken carried no
            # cross-game restriction at all. The generator reads the game list off disk (each
            # family's own `spec.ts`), so a sixth family is bound the moment its registration
            # point lands, with no edit here and none there.
            # Wired here so a cross-boundary import reds the frontend lane (born-RED
            # proven: a src/pencil/** -> @games/** import trips no-restricted-imports).
            # Build output (dist*/) is ignored by the config so bundled JS never
            # enters the lint set.
            - name: eslint (colocation boundary rig)
              working-directory: web/frontend
              run: npm run lint:eslint
            # knip — the standing dead-file / dead-dependency / dead-EXPORT gate
            # (T3-W5 + T4-W2). files/dependencies AND exports/types now enforce at
            # `error` (knip.json) — dead exported surface reds the lane, not just a
            # warn census. The two pencil barrels stay on `entry` this wave; W4 drops
            # them off `entry` as it deletes the barrels into one deep-import grammar.
            - name: knip (dead-file / dead-dependency / dead-export gate)
              working-directory: web/frontend
              run: npm run lint:knip
            # prettier — the repo-pinned format gate (T4-W4, D2). `.prettierrc.json`
            # pins 2-space (matching eslint.config.js / vite.config.ts / tsconfig.json)
            # with the tailwind class-sorter live; `npm run lint` is now the
            # non-destructive `prettier --check src/`, retiring the machine-global
            # `~/.prettierrc` shadow that rewrote the tree to 4-space on a bare run.
            # T5-W4 pass-7 Lane D (D6-G1/D6-G5) WIDENS the scope past `src/`: BOTH script
            # directories are in format scope and named — `web/frontend/scripts/` (20 files)
            # and the repo-root `scripts/` (4 .mjs; the three .sh have no prettier parser and
            # are skipped). Ten were unformatted and are formatted in the same commit as this
            # line. THE SCOPE IS THOSE THREE DIRECTORIES AND NOTHING ELSE — `src/`, `scripts/`,
            # `../../scripts/`, exactly as the `lint` script spells it. This is not a repo-wide
            # format gate: `web/frontend/e2e/` and `web/relay/` are OUT, deliberately, and
            # recorded here as such rather than narrated away (T7-W6 — 22 files across the two
            # are non-conformant today, which is what an unstated exclusion buys). Widening is
            # a ruling, and a ruling lands with its enforcing config.
            # The `--config .prettierrc.json` pin is load-bearing, not decoration: the
            # repo has exactly ONE prettier config and it lives under web/frontend, so a BARE
            # reach at `../../scripts/` resolves per-file UP past the repo and lands on the
            # very `~/.prettierrc` shadow the paragraph above retired (measured on the author's
            # host: `--find-config-path ../../scripts/ledger-diff.mjs` -> `$HOME`, tabWidth 4),
            # while a runner with no $HOME config would answer with prettier's own defaults.
            # Two answers for one file is how a green gate lies; the pin collapses them to one.
            - name: prettier (repo-pinned format check)
              working-directory: web/frontend
              run: npm run lint
            # P1-W3 font-coverage gate: the Fraunces subset's cmap against the text the app
            # actually renders — every string as AUTHORED and as its `text-transform` produces
            # it, plus `unicode-range` == cmap in both directions. The P5 subset was cut from
            # authored strings while `.section-heading` was uppercase, so 6 of 41 heading glyphs
            # painted in Fraunces and the rest in Georgia at weight 800. Static, zero-dependency,
            # lives here rather than in e2e because it needs no browser.
            - name: font coverage (subset cmap vs rendered text)
              working-directory: web/frontend
              run: npm run test:font-coverage
            # T4-P1 ink-pressure gate (scripts/check-ink-pressure.mjs). The graphite ramp,
            # asserted over EVERY rung in all three scopes that re-pitch its inputs (light,
            # dark, @media print) with every colour RESOLVED out of index.css — plus sole
            # ownership of the ramp (nothing outside the token block may open-code it, in
            # .vue/.css/.ts, under either spelling of the graphite var). Runs with
            # `--self-test`, so CI also re-proves each gate able to FAIL on a known-bad input
            # before trusting the green. Static and zero-dependency, so it lands in this lane
            # beside font-coverage rather than in e2e. Standing team-lead row since pass 2:
            # the script shipped at T4-P1 Lane D ship 4 and until now nothing in CI ran it.
            - name: ink pressure (graphite ladder + ramp ownership, self-tested)
              working-directory: web/frontend
              run: npm run lint:ink
            # T5-W2 row 2.4b — the swallow census. A catch body must run a statement or say
            # something; `/* ignore */` says nothing. The eleven it was born RED at were all
            # guards against a contract pencil-boil did not state until 0.11.0, where `stop()`
            # cannot throw in any lifecycle phase. Neither stock instrument measures the ruling
            # (core `no-empty` sees a comment and passes; the obvious selector reds eleven
            # honest sites whose only content IS a sentence), so the ruling carries its own,
            # self-tested like its siblings. Same species again — static, browser-free.
            - name: swallow census (no statement-free catch bodies, self-tested)
              working-directory: web/frontend
              run: npm run lint:catch
            # T7-W1 gate 1.1 — the never-written-selector census. `CageOverlay.vue` and
            # `ThermoTube.vue` carried `:root[data-theme=…]` rules for a whole campaign while
            # `useTheme.ts` wrote `class="dark"`: eight rules that could never match, shipped
            # in the built CSS, and not one gate in the estate read the surface — knip resolves
            # modules, not selectors. Every `[data-…]` selector in src must have a runtime
            # writer, every `prefers-color-scheme` block must be allowlisted with a reason, and
            # the table is closed both ways (a stale entry, and an entry whose attribute has
            # SINCE gained a writer, both red). Same species as the gates above it — static,
            # zero-dependency, browser-free. Born RED at cbf2ab49 on ten sites
            # (evidence/w1/gate1.1-born-red.txt); greenable by the cure with the allowlist
            # still EMPTY (evidence/w1/gate1.1-green-condition.txt).
            - name: theme-selector census (no never-written selectors, self-tested)
              working-directory: web/frontend
              run: npm run lint:theme-selectors
            # T5-W2 2.3a — the theme-token census, WIRED at T7-W6. Every `@theme` custom
            # property must have a consumer, and the consumed surface is read three ways: a
            # `var(--tok)` anywhere in the corpus, a Tailwind v4 utility minted from the token's
            # NAMESPACE, and — inside index.css itself — TRANSITIVELY, so an alias chain cannot
            # kill its own base. A token nobody reads is not a palette, it's a decoy: the next
            # hand picks a colour off the block and inherits shadcn's default greys in a crayon
            # estate. It passed and self-tested from the day it landed, in NO lane; that is one
            # of the two instances the lane-membership law below exists for.
            - name: theme-token census (every @theme token has a consumer, self-tested)
              working-directory: web/frontend
              run: npm run lint:theme-tokens
            # T5-W2 2.1c — the TDZ probe, WIRED at T7-W6. `lint:tdz` has been in package.json
            # since 2.1 and no CI step ever called it, which is a package.json script, not a
            # lane. Two arms: the GRAPH arm asserts the three severed edges of the old
            # `scene → game → registry → scene` cycle on the real tree, and the REPRODUCTION arm
            # writes four synthetic modules and imports them for real — the OLD shape must throw
            # the TDZ `ReferenceError: Cannot access '…' before initialization` and the NEW one
            # must boot, or the probe cannot see the hazard it claims to gate. The red arm is
            # the canary and runs on every invocation, not only under `--self-test`.
            - name: tdz probe (no registration cycle; reproduction both ways)
              working-directory: web/frontend
              run: npm run lint:tdz
            # T7-W6 — THE LANE-MEMBERSHIP CENSUS: the CLASS cure for the two rows above, not two
            # more instances. A gate no lane runs is not a gate, it's a decoy that reads like
            # enforcement, and the question "does a CI lane name this file?" is answerable from
            # two files on disk. Every `scripts/check-*.mjs` and `*-probe.mjs` is either named by
            # a CI-REACHABLE command — a `run:` line, or an `npm run <name>` in a
            # `working-directory: web/frontend` step resolved through package.json, chained runs
            # and npm's pre/post hooks included — or carries a `NOT-A-LANE:` declaration with a
            # reason and a cite. Only `run:` text counts: ci.yml narrates these scripts by name
            # in its comments all over, and treating a comment as enforcement is the exact false
            # green this refuses. Check 3 is the dual — a lane that names a script that is not on
            # disk reds too, so deleting a guard out from under its step cannot go quiet. Born
            # RED at HEAD on the two unwired guards (evidence/w6/lane-membership-born-red.txt);
            # green only through this wiring (evidence/w6/lane-membership-green-condition.txt).
            # W1's selector census and W2's occlusion gates land under it on day one, so a new
            # guard cannot ship unwired again.
            - name: lane membership (every gate/probe is wired or declared, self-tested)
              working-directory: web/frontend
              run: npm run lint:lanes
            # T5-W1 row 1.11 (audit C5 + J3) support floor. Same species as the seven
            # gates above it — static, zero-dependency, browser-free — and it needs
            # this job's `npm ci`: check 2 reads @tailwindcss/node's Lightning CSS
            # targets out of node_modules and REFUSES to pass when that input is
            # missing rather than degrading to a green. It goes LAST because it is the
            # only gate here that asserts across the repo boundary (it reads the root
            # README), so a floor red never masks a lint red. Five checks + seven
            # mutants under --self-test; born RED at 7 violations
            # (evidence/w1/support-floor-RED.txt).
            - name: 'support floor (browserslist vs the compiled targets; no sub-floor shims, self-tested)'
              working-directory: web/frontend
              run: npm run test:support-floor

    # ---------------------------------------------------------------- Lane 12
    # fe-unit — the FE unit estate joins CI (T5-W1 rows 1.1 + 1.14).
    #
    # Audit A1 CONFIRMED: 332 test blocks across 31 files, `test:unit` in
    # package.json since T4-W2, and NOT ONE CI job invoked it. The whole estate was
    # advisory. GAP-6 then found no coverage instrument anywhere in the repo — and
    # W2 collapses ~4,150 LOC across five games. Collapsing a majority of an estate
    # against an unmeasured test surface is the shape that ships a silent
    # regression, so both floors land HERE, before the distill.
    #
    # ONE vitest invocation feeds both: `test:unit:report -- --coverage` emits
    # vitest-report.json (the count floor's input) and coverage/coverage-summary.json
    # (the coverage floor's) in a single run — fragments/coverage.yml OPTION A, the
    # fold, verified end to end at r1.14-green-02-fold-one-invocation.txt. The
    # standalone `fe-coverage` job that fragment also offers is NOT taken: it would
    # re-run the same 332 tests for the same numbers.
    #
    # Node-only. It `needs:` build-lean-wasm for the file-link reason every Node
    # lane here does, not because any unit imports the wasm package.
    #
    # STEP ORDER IS THE CONTRACT: each gate's --self-test runs BEFORE the green it
    # grades (the lint:ink house pattern), and a red TEST is reported as a red test
    # rather than as a coverage dip.
    fe-unit:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [build-lean-wasm]
        steps:
            - uses: actions/checkout@v4
            - name: Download the lean wasm pkg (the package.json file-link target)
              uses: actions/download-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: csp-solver/wasm/pkg
            - name: Set up Node (LTS) with npm cache
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: web/frontend/package-lock.json
            # Node 24 ships npm 11.x already, but pin explicitly: older Node's npm 10
            # mis-resolves the lockfile.
            - name: Pin npm >=11
              run: npm install -g npm@^11
            - name: npm ci
              working-directory: web/frontend
              run: npm ci
            # The gates, before the greens they grade.
            - name: unit count gate self-test (every check shown able to fail)
              working-directory: web/frontend
              run: node scripts/check-unit-count.mjs --self-test
            - name: coverage floor gate self-test (every check shown able to fail)
              working-directory: web/frontend
              # --print removed at the W1 seal-fix: it reads the real summary, which
              # does not exist until the vitest step below runs (run 30719165442's red).
              run: node scripts/check-coverage-floor.mjs --self-test
            # vitest run — human log + the JSON report + the v8 coverage summary, all
            # from one pass. A red test exits nonzero HERE.
            - name: vitest run --coverage (FE unit estate)
              working-directory: web/frontend
              run: npm run test:unit:report -- --coverage
            # The count floor: >= the floor STAMPED in check-unit-count.mjs, counted in
            # EXECUTED tests (passed + failed; `.skip`/`.todo` are not executed and never
            # count). 300 was ~10% under 332 at the T5-W1 wave base; live is 477 today, so
            # the floor carries 59% of slack and a whole file's worth of estate can leave
            # with the lane still green. A narrowed `include`, a describe.skip over a whole
            # file, or a collection error all exit 0 from the step above with a cheerful
            # summary — only this one sees the number move. `--restamp <report>` is the
            # COMMAND that re-derives the floor (~10% under a live, clean census; it refuses
            # a report that is not a passing, self-consistent run, refuses a LOWERING without
            # a spoken `--allow-lower "why"`, and stamps the tree it measured into the file),
            # where "re-derive from a fresh census" was advice — and advice erodes. T7-W6
            # lands the mechanism; WGATE runs it, after the last row lands anywhere in the
            # tranche. A floor derived at W6's own seal is stale on arrival, which is the
            # exact slack the row exists to remove. Never nudge it down to meet a red.
            - name: unit count floor (>= the stamped floor)
              working-directory: web/frontend
              run: npm run test:unit:count
            # The coverage floor: every scope at or above the W1.14 baseline in
            # web/frontend/coverage-floor.json, which is the MINIMUM of a banked n=10
            # sample, not one run. No tolerance at compare time — a tolerance would
            # wave through exactly the sub-point regression the floor is for. A missing
            # summary is a RED, never a skip.
            - name: coverage floor (per-scope, >= the W1.14 baseline)
              working-directory: web/frontend
              run: npm run test:coverage:floor
            # A red lane hands back the censuses it red on, not just a console tail.
            - name: Upload the vitest JSON report (failure only)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: vitest-report
                  path: web/frontend/vitest-report.json
                  retention-days: 7
            - name: Upload the coverage summary (failure only)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-summary
                  path: |
                      web/frontend/coverage/coverage-summary.json
                      web/frontend/coverage/coverage-final.json
                  retention-days: 7

    # ---------------------------------------------------------------- Lane 13
    # Cross-game boundary law — 20/20 ordered pairs, GENERATED (T5-W1 row 1.4).
    #
    # GREEN SINCE T5-W2 2.5. This job landed EXPECTED RED at W1 and stayed red on
    # purpose: the defect was live at 23 cross-game imports (thermo->sudoku 8,
    # killer->sudoku 8, kenken->futoshiki 7), and the green date was pinned rather
    # than aspirational —
    #
    #     docs/tranches/2026-08-tranche-5/gates.json -> gates.W1.boundary.greensAt = "W2.5"
    #
    # — which W2 satisfied. F1 folded the two cells and the two cages into
    # `games/shared` (23 -> 17); F2/F3 took the boards, the scenes and the five solver
    # spines (17 -> 12); 2.5 broke the last twelve by moving what they reached for into
    # the shared floor rather than duplicating it: `Difficulty` to one home
    # (`games/shared/types`), the three duplicate selector bands to
    # `games/shared/selectors`, and the two technique adapters to ONE
    # `games/shared/techniqueAdapter` parameterised by `BoardGeometry`. The count is
    # 0 errors, re-derived; no rule was narrowed and no violation was suppressed.
    #
    # THE RULING NOW LANDS WITH ITS ENFORCING CONFIG. `eslint.config.js` imports the
    # generated blocks from `eslint.boundary.config.js` — the same module this job
    # runs — so the law gates every push through the `frontend` lane's `eslint .`
    # step. There is one generator and one law; `lint:boundary` is a census entry
    # point over it, not a second copy.
    #
    # WHY THIS LANE SURVIVES THE FOLD (W1 predicted it would retire): the canary
    # below. A generated matrix that silently discovered zero games would lint
    # vacuously green — the incumbent's exact defect one layer up — so the generator
    # throws below two families, and the canary PROVES that on a throwaway tree
    # before the real run is trusted. `eslint .` has nowhere to carry a negative
    # control; deleting this job would delete the only thing standing between a
    # generated law and a vacuous green. The banner comes off; the proof stays.
    boundary:
        name: boundary law (cross-game, 20/20 — generated, with its vacuity canary)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [build-lean-wasm]
        steps:
            - uses: actions/checkout@v4
            # eslint never reads the wasm pkg, but `npm ci` refuses to resolve the
            # lockfile without the file: link target present — so download rather
            # than build, and the lane stays Node-only.
            - name: Download the lean wasm pkg (the package.json file-link target)
              uses: actions/download-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: csp-solver/wasm/pkg
            - name: Set up Node (LTS) with npm cache
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: web/frontend/package-lock.json
            # Node 24 ships npm 11.x already, but pin explicitly: older Node's npm 10
            # mis-resolves the lockfile.
            - name: Pin npm >=11
              run: npm install -g npm@^11
            - name: npm ci
              working-directory: web/frontend
              run: npm ci
            # The generator must be able to FAIL before its red is worth anything. A
            # config that silently discovered zero games would lint vacuously green —
            # the incumbent's defect one layer up — so it throws below two families.
            # Proven here on a throwaway tree, then deleted, before the real run is
            # trusted. Banked equivalent: evidence/w1/boundary-RED.txt §4 canary B.
            - name: canary — the generator refuses to lint vacuously green
              working-directory: web/frontend
              run: |
                  set -u
                  CANARY=t5w1-boundary-canary
                  rm -rf "$CANARY"
                  mkdir -p "$CANARY/src/games/alpha"
                  printf 'export const alphaSpec = {}\n' > "$CANARY/src/games/alpha/spec.ts"
                  cp eslint.boundary.config.js "$CANARY/eslint.boundary.config.js"
                  set +e
                  ( cd "$CANARY" && npx eslint --no-config-lookup --config eslint.boundary.config.js src/games ) > canary.log 2>&1
                  CODE=$?
                  set -e
                  rm -rf "$CANARY"
                  cat canary.log
                  if [ "$CODE" -eq 0 ]; then
                    echo "::error::the boundary generator linted GREEN on a one-family tree — it cannot fail, so its green is worthless"
                    rm -f canary.log
                    exit 1
                  fi
                  if ! grep -q 'refusing to lint vacuously green' canary.log; then
                    echo "::error::the one-family canary failed for the WRONG reason (expected the generator's own guard; see the log above)"
                    rm -f canary.log
                    exit 1
                  fi
                  rm -f canary.log
                  echo "canary OK — the generator throws rather than green vacuously"
            # THE GATE. 0 errors since T5-W2 2.5 — green because nothing a game needs
            # lives in a sibling any more, not because the law was loosened.
            - name: eslint (cross-game boundary law, generated matrix)
              working-directory: web/frontend
              run: npm run lint:boundary

    # ---------------------------------------------------------------- Lane 9
    # e2e — Playwright over the Vue SPA (ratification R6). Node-only after the
    # T4-W2 compute-cost DAG: it `needs:` build-lean-wasm and DOWNLOADS the lean
    # @mkbabb/csp-solver-wasm pkg (the file: link target) rather than rebuilding it
    # — no Rust toolchain / wasm-pack / cargo cache here. It still pins npm >=11
    # (older Node's npm 10 mis-resolves the lockfile). playwright.config.ts's
    # webServer block spins `npm run dev` on :3000 for the run. The chromium
    # browser bundle is cached (keyed on the resolved Playwright version from the
    # lockfile) to keep CI-minutes cost down; the HTML report uploads on failure.
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        needs: [build-lean-wasm]
        steps:
            - uses: actions/checkout@v4
            - name: Download the lean wasm pkg (the package.json file-link target)
              uses: actions/download-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: csp-solver/wasm/pkg
            - name: Set up Node (LTS) with npm cache
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: web/frontend/package-lock.json
            # Node 24 ships npm 11.x already, but pin explicitly: older Node's npm 10
            # mis-resolves the lockfile.
            - name: Pin npm >=11
              run: npm install -g npm@^11
            - name: npm ci
              working-directory: web/frontend
              run: npm ci
            # T5-W1 row 1.10 (CH-56). `playwright test --list` only: no browser, no
            # dist, seconds — so it belongs UPSTREAM of the ~4-minute browser install.
            # A narrowed matrix is exactly the defect that makes the suite finish
            # faster and greener, so the gate that catches it must not be paid for
            # with the suite's own runtime. Five checks: the 9 (project, engine) pairs
            # across the 3 configs · all 20 specs claimed by exactly one config · every
            # spec on both engines unless HOLDOUTS says why · the 4 holdouts a closed,
            # cited set · per-project count floors. --self-test re-runs each check
            # against a known-bad matrix every run.
            - name: 'Playwright project matrix (CH-56 — no silent single-engine narrowing)'
              working-directory: web/frontend
              run: npm run test:e2e:projects
            # T5-W1 row 1.6 (B1 NARROWED). Reads the three Playwright configs through
            # their own defineConfig export, not by regex over the source — a comment
            # cannot satisfy it and a reformat cannot break it. Four checks: a config
            # granting any retry must declare failOnFlakyTests: true · every non-zero
            # retry is a NAMED grant carrying its class and reason · wordmark-webkit
            # stays at retries 0 (that grant died with the linux vacuity yield this row
            # hoisted the clip assertion out of) · failOnFlakyTests: false is never
            # hand-declared. Run 30690204551 is why: wordmark-webkit's sudoku row red
            # on attempt 1, green on attempt 2, reported flaky, lane exit 0.
            #
            # The SUITE half of row 1.6 — the hoisted edge-clip verdict and the 5/5
            # theme-bake guard — rides the existing built-dist step below with no CI
            # change: same job, same config, same preview, 23 tests -> 39.
            - name: 'Playwright retries policy (1.6 — a retried pass never greens a lane)'
              working-directory: web/frontend
              run: npm run test:e2e:retries
            # Key the browser cache on the resolved Playwright version so a bump
            # invalidates it (the on-disk bundle layout is version-specific).
            - name: Resolve Playwright version (from the lockfile)
              id: pw-version
              working-directory: web/frontend
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
            - name: Cache Playwright browser bundle
              id: pw-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
            # webkit too: P1 G3.4 (wordmark integrity) asserts in WebKit by construction — mark
            # 4's opsz and bake-intrinsic defects do not reproduce in Chromium.
            - name: "Install Playwright chromium + webkit (+ deps)"
              working-directory: web/frontend
              run: npx playwright install --with-deps chromium webkit
            - name: "Run the Playwright e2e suite"
              working-directory: web/frontend
              run: npx playwright test
            # T4-W2 golden gate — the capture/compare/review system (visual-golden.spec.ts
            # vs committed e2e/goldens/*-linux.png crops) + the per-image byte ceiling.
            # Runs in this job to reuse the checkout/node_modules/chromium bundle
            # (compute-cost DAG: no redundant setup for a 4-test suite).
            - name: "Run the visual golden gate"
              working-directory: web/frontend
              run: npx playwright test --config playwright-golden.config.ts
            # T5-W1.13, the BLIND BAND cure. darwin soul floor 0.017 < the observed
            # drift 0.03 < the linux coarse floor 0.05 — and ubuntu is the only
            # platform CI runs, so both clause-relaxed goldens (logo-light,
            # toggle-crest-dark) are green AND SILENT here: Playwright prints
            # "N pixels (ratio R)" only when an assertion FAILS, so a green run bans
            # its own measurement and seventeen consecutive linux greens said nothing
            # about a 0.03 drift. The cure is VISIBILITY, not a floor change — the
            # sun-crest clause keeps its authority and 0.05 stands.
            #
            # NOT A GATE: it enforces no floor, mints no baseline, adds no engine.
            # GOLDEN_MAGNITUDE=1 asserts both goldens at ratio 0 — strictly TIGHTER
            # than the shipped floors, so report mode cannot manufacture a green. It
            # exits non-zero for exactly one reason: the instrument produced no
            # measurement. Grep the log for `[golden-magnitude] JSON {…}`; the ratio
            # is recomputed from the baseline's IHDR geometry because Playwright CEILS
            # its printed ratio to 2dp (643 px of 220x220 is 0.0133 and prints "0.02").
            - name: "Magnitude report — the two clause-relaxed goldens (report only, no floor changes)"
              if: ${{ !cancelled() }}
              timeout-minutes: 6
              working-directory: web/frontend
              run: node scripts/golden-magnitude.mjs
            # T5-W1.13. The step's NAME changed with its script: check-golden-bytes.mjs
            # grew from one rule to eight — per-image ceiling · ESTATE TOTAL (110 KB,
            # derived from the estate's own mint history, summed since T4 and never
            # gated until now) · fossils (any *.png under e2e/ outside e2e/goldens) ·
            # decode + blank floor · pairing/orphans/missing baselines · the
            # engine/template collision guard. A red has to read as what it is.
            #
            # T7-W6 adds the last two. COUNT PIN — exactly 8 goldens on disk, an EQUALITY, so
            # a ninth is a ruling by construction instead of by arithmetic that must be
            # re-derived at every reviewed crop-tighten; that re-derivation IS the drift
            # mechanism, since the band was cut against a 101,341 B total that reads 92.5 KB
            # today and a ninth AND tenth simply fit inside the ~18 KB of unearned room. The
            # byte band is demoted to the SECONDARY control — it still answers the question
            # the count cannot, whether the eight are ballooning. ESTATE PRESENT — a wiped
            # goldens dir used to exit 0 on "nothing to police"; it reds now whenever specs
            # assert goldens and zero baselines are on disk. Both ablation-proven, with the
            # unperturbed estate as the control (evidence/w6/golden-estate-ablation.txt).
            #
            # `if: ${{ !cancelled() }}` is the one behavioural addition: this step used
            # to be skipped whenever the golden COMPARE red, which made the estate
            # check hostage to a flake in a different gate. An orphaned or unpaired
            # golden is exactly the defect that arrives WITH a red compare.
            - name: "Golden estate gate — count pin, bytes, total, fossils, decode, pairing"
              if: ${{ !cancelled() }}
              working-directory: web/frontend
              run: npm run test:golden:bytes
            # T5-W1.13 — the gate that proves the gate. GOLDEN_DELTA=black|invert is
            # the visual-golden machinery's own acceptance test: it injects a
            # deliberate, reproducible regression so the capture-compare can be PROVEN
            # to bite. It lived in the spec and in prose and in NO CI step, and a
            # compare that has silently stopped comparing looks exactly like a compare
            # that is passing (gate-soundness.md:114).
            #
            # GRADED ON WHY EACH ARM RED, NOT ON THE EXIT BIT. This step used to invert
            # playwright's own exit code — red when the run SUCCEEDED — and an arm that
            # reds for its OWN reasons is the same vacuous green in a louder costume: the
            # `invert` arm red at `toHaveClass(/dark/)`, its own postcondition, three lines
            # before any screenshot was taken, and a postcondition red and a compare red
            # exit identically. `scripts/golden-selfdelta.mjs` runs both arms with
            # `--reporter=json` and grades the claim as written — EVERY golden must red, and
            # every red must carry a `toHaveScreenshot` message. Anything else is a setup
            # error (exit 1); no JSON at all is an instrument failure (exit 2). The ARM was
            # fixed too, never the grading: the `invert` delta reads the theme BEFORE the
            # click and settles on the flip wherever it lands
            # (evidence/w6/selfdelta-invert-ablation.txt).
            #
            # Both arms run because they fail differently — `black` proves the RASTER
            # path compares, `invert` proves the THEME path does. Neither writes a
            # baseline. It runs LAST of the golden steps because it perturbs the app,
            # so it must not precede a measuring step.
            - name: "Self-delta — prove the golden compare still bites (both arms)"
              if: ${{ !cancelled() }}
              timeout-minutes: 6
              working-directory: web/frontend
              run: node scripts/golden-selfdelta.mjs
            # BUILT-DIST gates — three projects on ONE bundled preview build
            # (playwright-throttle.config.ts, port 4188), all testIgnored from the default
            # config so they must run explicitly or they go dark:
            #   · throttled-void — the T4-W2 D3 recovery probe.
            #   · filter-census  — P1 G3.1/G3.2, the live-filter budget
            #     (src/pencil/config/filterBudget.ts) enforced as an EXACT-MATCH allowlist
            #     against the artifact that deploys, plus the forwards/both fill census.
            #     A new filter surface reds here even when an old one retires.
            #   · wordmark-integrity — P1 G3.4, in WEBKIT: the five wordmarks' baked ink inside
            #     its own box, and zero Georgia-fallback glyphs. Both defects are WebKit's, so
            #     this project pins `browserName: webkit` and the job installs that bundle too.
            #     ON THIS RUNNER, count it honestly: `e2e/linux-webkit-bake-quarantine.ts`
            #     `test.fixme`s the five per-game rows on ubuntu·webkit (CH-62, THIRD PINNING),
            #     so 1 of the 6 asserts here — the zero-fallback-glyph row. The other five are
            #     live on darwin and nowhere in CI. T7-W6 subtracts declared quarantines from
            #     the count floors at their DECLARED platform (check-pw-projects.mjs), so a
            #     parked row is no longer counted as coverage: wordmark-webkit's live floor is
            #     1, and theme-bake-webkit's is 0 — all 10 of its rows are parked, which makes
            #     that project a name rather than a gate on the only platform CI runs.
            - name: "Run the built-dist gates (throttled-void + filter census + wordmark)"
              working-directory: web/frontend
              run: npm run test:e2e:throttle
            # T4-W4 prod-shake proof (FAM-5): the DEV-gated FilterTuner /
            # rafInstrumentation / __schedulerDebug (T7-W6: the third symbol read
            # `schedulerDebugInfo` until this wave — a LOCAL binding esbuild renames to one
            # letter, so the literal could never appear in a bundle, leaked or not; the
            # global the probe writes on `window` is the one minification must keep) must be
            # tree-shaken out of the shipped bundle. Note the reach: identifier-substring
            # policing of a minified bundle only catches what minification has a REASON to
            # keep — property names, string literals, and the chunk file names vite derives
            # from a dynamically-imported module. Reuses dist-throttle/ (the bundled
            # production build the throttle gate just produced) — compute-cost DAG, no
            # redundant build.
            - name: "Prod-shake proof (dev tuner absent from the bundle)"
              working-directory: web/frontend
              run: npm run test:prod-shake -- dist-throttle
            # T7-W1 gate 1.1, the BUILT-CSS arm. The src census (the static-lint lane) can
            # read green while a dead selector still ships — a stale chunk, a vendored
            # stylesheet, or an unrebuilt dist all land only here, and W1's acceptance is
            # written about the BUILT CSS. Reuses dist-throttle/, the production build the
            # throttle gate just produced, per prod-shake's idiom above; the arm REFUSES
            # (exit 2) rather than greening when the dist is absent. Born RED at cbf2ab49 on
            # the two chunks that carry the dead blocks (evidence/w1/gate1.1-dist-arm.txt).
            - name: "theme-selector census (built CSS: no dead selector survives the build)"
              working-directory: web/frontend
              run: npm run lint:theme-selectors -- --dist dist-throttle
            - name: Upload Playwright HTML report (failure only)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: web/frontend/playwright-report
                  retention-days: 7
            # The built-dist gates report SEPARATELY (playwright-report-throttle/): they run
            # last, and until run 30684983201 they wrote no HTML report at all — that red named
            # a test-results/ screenshot this job never uploaded, and `playwright-report`
            # carried the golden gate's report instead. Both paths ship now, so a throttle red
            # arrives with its screenshot, its error context and its bake attachments.
            - name: Upload the built-dist gates' report (failure only)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-throttle
                  path: web/frontend/playwright-report-throttle
                  if-no-files-found: ignore
                  retention-days: 7

    # ---------------------------------------------------------------- Lane 14
    # perf subset — gates.json's idle thresholds, EXECUTED (T5-W1 row 1.2).
    #
    # THE HOLE THIS FILLS: the P1 patch's gates.json is a committed threshold file
    # that nothing has ever run. r1/perf-disposition.md §3.2 put it plainly — "a
    # regression to 79 fps idle would pass every CI lane". The filter census is a
    # good proxy for the cured MECHANISM, but proxy != surface: a new perf defect
    # with zero new filters is invisible to it.
    #
    # WHAT THIS LANE ENFORCES, and only this — idle fps + long-frame(>33.4ms)
    # census, an undo burst, and a boot-window TBT on the BUILT DIST, headless
    # chromium AND webkit, thresholds read from
    # patches/p1-safari-ios-performance/gates.json at RUN TIME:
    #   desktop.idle3s.maxLong33 (0)  GATE A, absolute, engine-portable
    #   desktop.idle3s.minFps    (97) GATE B, transposed to a fraction of the
    #                                 runner's own measured rAF ceiling
    #   desktop.undoBurst             GATE C (T7-W6, CH-53) — the scenario has been
    #                                 measured on every manual run since P1 and
    #                                 priced nowhere; a committed instrument with no
    #                                 threshold is the same defect as a committed
    #                                 threshold with no executor, read from the other
    #                                 end. TWO numbers, because there are two
    #                                 surfaces: `minFps` (52) is the REAL-SAFARI
    #                                 floor the manual matrix enforces, and
    #                                 `ciMinPctOfCeiling` is this harness's own
    #                                 %-of-ceiling, DECLARED rather than transposed —
    #                                 headless WebKit reads its ceiling on this
    #                                 window, so 52/98.4 would hand CI a floor ~47%
    #                                 under live, the very slack W6 exists to remove
    #   boot.tbt.maxTbtMs             GATE D (T7-W6) — median TBT over the first
    #                                 boot.tbt.windowMs, measured under
    #                                 boot.tbt.cpuThrottleRate× CPU throttling. Every
    #                                 other row here watches STEADY STATE; the boot
    #                                 burst happens once, before the first idle window
    #                                 opens, and had nothing to trip. Graded only on
    #                                 engines whose PerformanceObserver ships the
    #                                 `longtask` entry type — WebKit's does not, so
    #                                 its row prints NOT MEASURED, never PASS, and a
    #                                 run where NO engine could measure it is a setup
    #                                 error rather than a green from an instrument
    #                                 that ran nowhere
    # Nothing here hardcodes a number; a missing gates.json is exit 2, never a
    # default. Every other gates.json row needs real Safari, a real simulator or
    # ps-level attribution and stays a documented MANUAL lane
    # (web/frontend/perf-rig/README.md), whose first run-id banks at W-GATE.
    #
    # WHAT A GREEN HERE DOES NOT MEAN: Playwright WebKit is not Safari. This
    # harness read 80-98 fps on the exact surface the owner called a rendered mess.
    # Read the lane as a REGRESSION TRIPWIRE on the cured mechanism. It is not a
    # Safari number and it is not an iOS claim.
    #
    # NOT folded into `e2e` (which has both engines and a dist-throttle/ already,
    # so folding would cost one command): `e2e` carries five suites against a
    # 25-minute budget, a frame-timing window taken in the tail of a heavy
    # Playwright run measures a runner that has just been hammered, and the exit-3
    # retry below has no clean home mid-suite.
    #
    # EXIT-CODE CONTRACT — the part not to flatten:
    #   0 every threshold held
    #   1 a gates.json threshold was BREACHED            -> fail, NEVER retried
    #   2 setup/usage error — no gates.json, a missing threshold key, an unknown
    #     engine name, a reserved port, a failed build; NO engine in the run able to
    #     measure boot TBT (a GATE D green from an instrument that ran nowhere is
    #     vacuous); or CPU throttling requested and not applied, because an
    #     unthrottled number read against a throttled floor is not a lenient
    #     measurement, it is a different one                -> fail
    #   3 INSTRUMENT failure — too few clean windows, or the app-free control page
    #     itself dropped a long frame                    -> retried ONCE, then fails
    #
    # PRECEDENCE (T7-W6): every measured result is graded BEFORE any exit is chosen,
    # and the code is the WORST FACT in the run — 1 > 2 > 3 > 0. A breach outranks a
    # setup error and an instrument failure because a breach is a fact about the
    # BUNDLE while the other two are facts about the HOST, and a bad host cannot
    # un-measure a bad bundle. The old shape graded AFTER the engine loop, so a later
    # engine's early return discarded a chromium breach that had already been measured
    # and the job shipped green (evidence/w6/ci-subset-ablation.txt). Precedence
    # promotes nothing on its own: an instrument failure with no breach beside it is
    # still a 3.
    #
    # The retry covers exactly one documented flake class: host contention on a
    # shared runner, detected by the control page. A breach is never retried,
    # because a breach is a fact about the bundle. Do not collapse 3 into 0.
    perf-subset:
        name: perf subset (gates.json idle + undoBurst + boot-TBT thresholds, chromium + webkit)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [build-lean-wasm]
        steps:
            - uses: actions/checkout@v4
            - name: Download the lean wasm pkg (the package.json file-link target)
              uses: actions/download-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: csp-solver/wasm/pkg
            - name: Set up Node (LTS) with npm cache
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: web/frontend/package-lock.json
            # Node 24 ships npm 11.x already, but pin explicitly: older Node's npm 10
            # mis-resolves the lockfile.
            - name: Pin npm >=11
              run: npm install -g npm@^11
            - name: npm ci
              working-directory: web/frontend
              run: npm ci
            # Same cache key as `e2e`, so whichever lane runs first warms it for the
            # other.
            - name: Resolve Playwright version (from the lockfile)
              id: pw-version
              working-directory: web/frontend
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
            - name: Cache Playwright browser bundle
              id: pw-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
            # Both engines: the P1 defect was WebKit's and chromium alone would have
            # missed it entirely. webkit is the load-bearing arm; chromium is the
            # cross-engine control that says whether a red belongs to one engine or both.
            - name: 'Install Playwright chromium + webkit (+ deps)'
              working-directory: web/frontend
              run: npx playwright install --with-deps chromium webkit
            # THE GATE. `--build` forces a fresh `vite build` (skipping vue-tsc and the
            # prebuild wasm make — the same call playwright-throttle.config.ts makes,
            # for the same reasons). Port 4390 is the rig's own; the script refuses
            # 3000/3001/4188/4288 outright and kills its server on the way out.
            - name: 'gates.json idle thresholds (idle fps + long-frame census)'
              working-directory: web/frontend
              run: |
                  set -u
                  set +e
                  node perf-rig/ci-subset.mjs --port 4390 --runs 3 --build \
                    --out perf-subset-report.txt
                  CODE=$?
                  if [ "$CODE" -eq 3 ]; then
                    echo "::warning::perf subset could not measure (exit 3) — the runner's own app-free control page dropped a long frame, or too few windows came back clean. Retrying once; this is the documented contention flake class, NOT a threshold breach."
                    node perf-rig/ci-subset.mjs --port 4390 --runs 3 \
                      --out perf-subset-report.txt
                    CODE=$?
                  fi
                  set -e
                  case "$CODE" in
                    0) echo "perf subset GREEN — GATE A (long-frame census), GATE B (idle fps), GATE C (undoBurst) and GATE D (boot TBT) all held, on every engine that could measure them" ;;
                    1) echo "::error::perf subset RED — a gates.json threshold was breached. See the report artifact; the BREACH lines name the engine, the measured value and the derived threshold. Do NOT retry this and do NOT tune the threshold: gates.json is the P1 patch's sealed commitment." ;;
                    2) echo "::error::perf subset setup error — gates.json unreadable, a reserved port, or a failed build. This lane carries no fallback thresholds by design." ;;
                    # Exit-3-twice ruling (W1 seal-fix, run 30719165442): an instrument
                    # that cannot hold its own budget asserts NO verdict — failing the
                    # job would claim a red the instrument itself refuses. The report
                    # still uploads. Since T7-W6 a 3 means what it says: every measured
                    # result is graded before an exit is chosen and the code is the
                    # WORST FACT in the run (1 > 2 > 3 > 0), so a breach anywhere exits
                    # 1 no matter which engine's instrument died. What makes a chromium
                    # breach gate is that grading, NOT that chromium runs first —
                    # `--engines` order is a caller's argument, not a law. Reaching 3
                    # twice therefore says nothing breached on what DID measure; the
                    # admissible webkit evidence is the darwin perf-rig lane + the
                    # manual Safari matrix.
                    3) echo "::warning::perf subset INADMISSIBLE-HOST — the runner's app-free control dropped a long frame twice running; neither green nor red is admissible for webkit here. Recorded, report uploaded; the darwin perf-rig lane and the manual Safari matrix carry the webkit verdict. Not a bundle regression."
                       CODE=0 ;;
                    *) echo "::error::perf subset exited $CODE (unexpected)" ;;
                  esac
                  exit "$CODE"
            # Uploaded green or red: a perf number is worth what its run record is
            # worth, and the green runs are the baseline the next red is read against.
            - name: Upload the perf subset report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: perf-subset-report
                  path: web/frontend/perf-subset-report.txt
                  if-no-files-found: warn
                  retention-days: 30

    # ---------------------------------------------------------------- Lane 10
    # iai — instruction-count baseline gate for the solver hot path (P6 ADOPT,
    # Tranche-II Pass-2; re-founded T4-W2). arm64-macOS can't run Valgrind, so
    # callgrind counts are Linux/CI-only; `benches/iai_queens.rs` measures one
    # fully-deterministic 8-queens first-solution solve (AC-3 + FailFirst) under
    # callgrind. Instruction count is a pure function of the compiled binary.
    #
    # WHAT THIS GATES (and what it used to NOT gate): the prior lane ran the SAME
    # bench binary twice and asserted |I2-I1|/I1 < 1% — a determinism tautology.
    # run1 == run2 for any commit (identical binary => identical count), so the
    # delta was identically 0 and a 2x hot-path regression sailed green: the only
    # absolute baseline was never stored across commits, never compared. This lane
    # now runs the bench ONCE and diffs the measured count against a golden
    # committed at `csp-solver/benches/iai_queens.baseline`, failing outside a
    # +/-2% band (gate logic: `csp-solver/benches/iai_gate.sh`).
    #
    # SEARCH-TRAJECTORY / INSTRUCTION-COUNT LOCK: legitimate improvements must
    # re-baseline deliberately in a reviewed commit (edit iai_queens.baseline) —
    # this gate reds on a real speedup as loudly as on a regression, exactly like
    # the frozen search-node tripwire (gac_kernel_beats). No silent auto-update,
    # or it drifts back into the tautology it replaced.
    #
    # WHY +/-2%: on a pinned binary the count is exactly deterministic (P6: 3
    # runners, 0.000000% delta), but this lane rides `@stable`, whose rustc
    # codegen shifts release-to-release move this small kernel's count by well
    # under a percent; 2% clears that drift with headroom while a real
    # algorithmic regression (a doubled hot loop is +40..100%) fails by a wide
    # margin. Tighten the band (or pin the toolchain) when a shift proves it too
    # loose — that too is a reviewed re-baseline.
    #
    # Budget: Valgrind is apt-installed (~15 s) and iai-callgrind-runner is
    # cargo-install-cached in ~/.cargo/bin. Cache-cold the runner build dominates
    # (~2 min total); cache-warm the whole lane is ~40 s.
    #
    # CARGO_TERM_COLOR + IAI_CALLGRIND_COLOR are pinned to `never` for the WHOLE
    # job so no ANSI escape (the grey `\e[90m`) smuggles a bare "90" into the
    # numeric gate ahead of the real Instructions count (the P6 run-1/2 parser
    # bug). The gate ALSO ANSI-strips + anchors the digit-run to the
    # `Instructions:` label — belt and suspenders (folded from spike/iai-callgrind
    # ff5d9de3, "harden gate parser — strip ANSI, anchor to Instructions label").
    iai:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            RUST_BACKTRACE: 1
            IAI_BENCH: iai_queens
            IAI_CALLGRIND_COLOR: never
            CARGO_TERM_COLOR: never
            IAI_TOLERANCE_PCT: '2.0'
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: "Install Valgrind (callgrind)"
              run: |
                  sudo apt-get update
                  sudo apt-get install -y valgrind
                  valgrind --version
            - name: Cache cargo registry + target (+ ~/.cargo/bin for the runner)
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ~/.cargo/bin
                      target
                  key: cargo-iai-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: "Install iai-callgrind-runner (must match the 0.16.1 dev-dep)"
              run: |
                  if ! command -v iai-callgrind-runner >/dev/null 2>&1; then
                    cargo install iai-callgrind-runner --version 0.16.1 --locked
                  fi
                  iai-callgrind-runner --version || true
            - name: "Run — measure the callgrind instruction count"
              run: |
                  set -o pipefail
                  cargo bench -p csp-solver --bench "$IAI_BENCH" 2>&1 | tee run.log
            - name: "GATE — diff measured count vs the committed golden (+/-2% band)"
              run: |
                  bash csp-solver/benches/iai_gate.sh \
                    run.log \
                    csp-solver/benches/iai_queens.baseline \
                    "$IAI_TOLERANCE_PCT"
            - name: "Upload log + baseline + callgrind out-files"
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: iai-evidence
                  path: |
                      run.log
                      csp-solver/benches/iai_queens.baseline
                      target/iai/**
                  if-no-files-found: warn

    # ---------------------------------------------------------------- Lane 11
    # cargo-audit — supply-chain advisory tripwire (T4-W5, FAM-4/F4). Cheap and
    # INDEPENDENT: no `needs:` (the compute-cost DAG note above — a lint-before
    # edge would only lengthen a critical path without killing redundant compute).
    # It reads the committed Cargo.lock and checks every crate against the RustSec
    # advisory DB. The dep set is tiny and all-latest — 0 VULNERABILITIES today
    # (two informational `unmaintained` warnings, bincode 1.3.3 + proc-macro-error2
    # 2.0.1, which the default `cargo audit` does NOT fail on) — so this is a
    # forward tripwire against a future RustSec vulnerability against any of the
    # workspace's crates, not a fix for a live CVE. ubuntu-latest ships cargo, so no
    # rust-toolchain install is needed — only the cargo-audit binary (taiki-e
    # binary cache, no compile). It does NOT build the workspace, so no cargo
    # target cache either.
    cargo-audit:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - name: Install cargo-audit (prebuilt binary, taiki-e cache)
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-audit
            - name: cargo audit (RustSec advisories over the committed Cargo.lock)
              run: cargo audit

    # ---------------------------------------------------------------- Lane 16
    # evidence-policy — the byte caps docs/tranches/EVIDENCE-POLICY.md promised and
    # nothing enforced (T5-W1 row 1.3).
    #
    # EVIDENCE-POLICY.md:13 said "the gate greps the wave's evidence dir for *.png,
    # sums bytes, and fails on breach". Audit A3 CONFIRMED-worse: at the wave base
    # the estate carried 73 live breaches — 64 images over the 153,600 B per-image
    # cap, 5 wave buckets over the 2,097,152 B per-wave cap, and 4 filenames
    # matching the banned /-full\.png$/ viewport pattern. RED banked at
    # evidence/w1/evidence-policy-RED.txt; GREEN after the once-only sealed-tranche
    # adjudication at evidence-policy-GREEN.txt.
    #
    # Its own job rather than a step in `frontend`: the scope is docs/tranches/**,
    # the script is zero-dependency Node with no package.json above it, and it must
    # not queue behind build-lean-wasm to tell an author their capture is 400 KB.
    # ~10 s wall. No npm pin — this lane never invokes npm.
    #
    # --self-test is not decoration: it re-proves all three rules able to FAIL (and
    # able NOT to fire on a conformant estate) against a synthetic tree before the
    # real audit runs, so a green here is never a green from a broken instrument.
    evidence-policy:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node (LTS)
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
            # Walks docs/tranches/** on the checked-out worktree — exactly the tracked
            # set, so CI and a local run agree. Caps and the name ban come off
            # EVIDENCE-POLICY.md:9-11 and are pinned by gates.json W1.evidencePolicy.
            # The 64 image pins + 5 wave pins in the script are the sealed-tranche
            # grandfather, each a byte CEILING: a grandfathered file that grows, or a
            # grandfathered wave that gains an image, reds. Additions to those lists
            # are forbidden — the cure for a breaching capture is a crop.
            - name: evidence policy (per-image + per-wave caps, viewport name ban, self-tested)
              run: node scripts/check-evidence-policy.mjs --self-test

    # ---------------------------------------------------------------- Lane 17
    # doc-truth — the doc-canon gate joins CI (T5-W0 row 0.2, wired at T5-W1 row 1.7).
    #
    # Thirteen rows, each of which RE-DERIVES its truth from the artifact at run time
    # and then asserts the docs say that: a byte count off the built .wasm, a
    # version off Cargo.toml/package.json, a test roster off the #[test] attributes,
    # an e2e total off `playwright test --list`, the twiggy bands off the workflow's
    # own guards, the iai golden off the baseline the iai lane grades against, the
    # `make wasm` recipe off the Makefile's own recipe line. Nothing is pinned, so
    # when the code moves the gate moves with it and the PROSE is what goes red.
    # Born RED 10/10 pre-W0-merge, green at W0's landing (evidence/w0/).
    #
    # RE-DERIVATION, NOT PINNING — the lane is toolchain-drift tolerant by
    # construction, and that is why it can live on `push` without becoming a
    # restamping chore.
    #
    # WHY IT DOWNLOADS THE WASM ARTIFACT: the lean-bytes row measures whichever
    # built artifact is on disk. With none it DEGRADES — it derives the figure from
    # ci.yml's own band comment and then, correctly, refuses to grade ci.yml against
    # a number it just read out of ci.yml. A degraded run is a guaranteed red, so
    # the artifact is downloaded rather than skipped. darwin and this runner
    # disagree by ~2 KB on the same source; the doc sites carry BOTH figures for
    # exactly that reason.
    #
    # WHY IT RUNS `npm ci`: the e2e-census row shells `playwright test --list` over
    # the three configs. `--list` launches no browser and starts no webServer, so no
    # `playwright install` is needed here — only the node_modules that carry the
    # runner and the configs' imports.
    doc-truth:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [build-lean-wasm]
        steps:
            - uses: actions/checkout@v4
            - name: Download the lean wasm pkg (the artifact the lean-bytes row measures)
              uses: actions/download-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: csp-solver/wasm/pkg
            - name: Set up Node (LTS) with npm cache
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: web/frontend/package-lock.json
            # Node 24 ships npm 11.x already, but pin explicitly: older Node's npm 10
            # mis-resolves the lockfile.
            - name: Pin npm >=11
              run: npm install -g npm@^11
            - name: npm ci
              working-directory: web/frontend
              run: npm ci
            # THE GATE. One line per failing site: row id, file:line, expected, got —
            # and a `derived:` line under EVERY row, red or green, naming what the
            # tree actually says. Read the derived lines: a band that derives to 0 is
            # now a red (T5-W1), but the numbers are the point of the output.
            - name: doc truth (every row and figure re-derived at run time)
              run: node scripts/check-doc-truth.mjs
            # THE LEDGER'S OWN GATE (T7-W0 0.2 / T7-R04, U-11's cure made real). The doc-truth
            # rows grade prose against the tree; this one grades the LIVING LEDGER against it —
            # a §1 row landing at a wave of a sealed tranche, a row a one-line probe refutes, and
            # a file:line cite that no longer points where it says. Zero dependencies, no
            # artifact, no npm: it rides here only because this is the doc-gate lane. Born RED at
            # 6a180b35 on fourteen rows (evidence/w0/ledger-diff-born-red.txt); the same script
            # printed GREEN over four of them for a whole campaign, which is why --self-test is
            # not decoration — it re-proves every arm able to FAIL before the audit runs.
            - name: ledger truth (per-tranche corpus, state currency, cite resolution, self-tested)
              run: node scripts/ledger-diff.mjs --require-ledger --assert-state --verify-cites --self-test

    # ---------------------------------------------------------------- Lane 18
    # npm-audit — the npm advisory tripwire (T5-W1 row 1.15, r3/security-posture
    # Row 4).
    #
    # The repo gated its Rust supply chain and not its npm one: `grep -nE 'npm
    # audit' ci.yml` at the wave base had NO HITS while cargo-audit had had a job
    # since T4-W5. Three high-severity advisories sat live in
    # web/frontend/package-lock.json with nothing in CI able to say so (postcss
    # GHSA-r28c-9q8g-f849, sharp GHSA-f88m-g3jw-g9cj, brace-expansion
    # GHSA-mh99-v99m-4gvg).
    #
    # WHY THIS IS NOT REDUNDANT WITH THE DEPENDABOT DASHBOARD, which is the whole
    # point of the lane: Dependabot DID raise the brace-expansion alerts (#71, #72)
    # and auto-triage suppressed both in the same second they were created —
    # `auto_dismissed_at` == `created_at`, `scope: development`. The only two
    # auto_dismissed records in the repo's 62-alert history. A dev-scoped high
    # therefore NEVER enters the `open` set, so row 1.8's zero-open gate reads clean
    # while the advisory is live in the lockfile. `npm audit` has no dev-scope
    # suppression and no auto-triage. For that class this lane is the ONLY oracle.
    #
    # `--omit=dev` IS DELIBERATELY ABSENT: adding it would reproduce, inside CI, the
    # exact blindness that let brace-expansion hide for a week. Dev-only advisories
    # run on developer machines and on this runner.
    #
    # `--package-lock-only` audits the committed lockfile directly — no
    # node_modules, no install, no file-link target, so no `needs:` and no npm ci.
    # Equivalence to the installed-tree audit was verified both ways
    # (evidence/w1/npm-audit-canary.txt): the flag changes the input, not the
    # verdict. Moderate/low findings are reported but do not fail at this level, the
    # same posture cargo-audit takes with its informational `unmaintained` warnings.
    # If the moderate census ever needs teeth, adjudicate the LEVEL; never add
    # per-advisory exceptions.
    npm-audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # No `needs:` on purpose — independent, cheap, off every critical path.
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node (LTS)
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
            # npm 11 is load-bearing, not ceremony: npm 10 mis-resolves this lockfile
            # (engines.npm >=11), and an audit of a mis-resolved tree grades the wrong
            # versions.
            - name: Pin npm >=11
              run: npm install -g npm@^11
            - name: npm version (recorded — the audit is only as good as the resolver)
              run: npm --version
            # THE GATE. Exit nonzero on any high/critical advisory. No
            # continue-on-error, no --omit, no allowlist.
            - name: npm audit (high+, frontend lockfile)
              working-directory: web/frontend
              run: npm audit --audit-level=high --package-lock-only
            # A red lane hands back the machine-readable census it red on. `|| true`
            # is scoped to THIS reporting step; the gate above already decided the job.
            - name: Capture the audit JSON (failure only)
              if: failure()
              working-directory: web/frontend
              run: npm audit --json --package-lock-only > npm-audit.json || true
            - name: Upload the audit JSON (failure only)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: npm-audit-report
                  path: web/frontend/npm-audit.json
                  retention-days: 7

# ci — PR + push gate matrix for the CSC411_HW2 monorepo (W0 build restoration).
#
# Authored for the LIVE workspace root = REPO ROOT (repo-root Cargo.toml is the
# Cargo workspace with members csp-solver + csp-solver/wasm — morph-core and
# wasm-morph excised to github.com/mkbabb/morph at the W12 window (see the
# pre-morph-excision tag). Edition 2024 + stable toolchain (T2-W1: the nightly pin
# was vestigial — rust-toolchain.toml at repo root pins channel=stable, MSRV 1.88,
# and every lane below installs `dtolnay/rust-toolchain@stable` accordingly). This
# re-applies the queens-smoke lane from the composed seed (kernel-soundness-closure
# §6) and adds the full campaign-amended gate set from the W0 lane table
# (docs/tranches/2026-07-grand-uplift/waves/W0-build-restoration.md).
#
# NOTE on workspace-root adaptation: the seed workflow was written for csp-solver/
# as the Cargo root, so its cargo commands ran there. Here the workspace root is the
# REPO ROOT — cargo runs at repo root, and the queens bench needs `-p csp-solver`
# because the benches live in the csp-solver package.
#
# Lane → job map (W0 lane table; provenance cited per step; T3 grew the rust,
# py-runtime, and frontend jobs with the gac-ab/corpus-spine smokes, stubtest +
# tripwire, and knip; T4-W2 added the eslint boundary lane, promoted knip to
# error-level, and re-cut the flat fan-out into a compute-cost DAG) — the lane
# set rides ten jobs (the rust job carries lanes 2 + 3):
#   0.  build-lean-wasm    -> build-lean-wasm (the SHIP lean artifact built ONCE,
#                                         uploaded as `lean-wasm-pkg`; frontend +
#                                         e2e + twiggy(lean half) `needs:` it and
#                                         download — kills 2 redundant lean builds
#                                         + the Rust toolchain in frontend/e2e)
#   1.  fmt + clippy       -> lint       (clippy -D warnings; strict, no continue-on-error)
#   2.  build + test       -> rust       (cargo build/test --workspace — NEVER per-crate)
#   3.  bench + corpus smoke-> rust      (queens assert_eq!(92/14200); gac_ab --test;
#                                         gac_ab_corpus 0/50 false-UNSAT + 40,513→4,678
#                                         node-count spine — T3-W6 ROW-3a/3d)
#   4.  py compile         -> py-compile (cargo check --features py under Python 3.13 — pyo3 0.29-tested floor, not a hard ceiling)
#   5.  py runtime         -> py-runtime (maturin wheel -> uv venv -> pytest in csp-solver/tests-py)
#   6.  wasm               -> wasm       (wasm-pack test --node + clippy --target wasm32)
#   7.  twiggy budgets     -> twiggy     (full module fail>240 KB / warn>230 KB; lean
#                                         half downloads the shared ship artifact)
#   8.  frontend           -> frontend   (download lean pkg; npm ci --dry-run; npm ci;
#                                         vue-tsc --noEmit; eslint boundary rig; knip)
#   9.  e2e                -> e2e        (download lean pkg -> Playwright over the Vue SPA)
#   10. iai                -> iai        (callgrind deterministic instruction-count baseline)
#
# Compute-cost DAG (T4-W2, r4-corrected — a `needs:` saves redundant CI minutes,
# NOT wall-time; a predecessor serializes onto each dependent's critical path, so
# edges are added ONLY where they kill redundant compute without lengthening the
# critical path): build-lean-wasm ← {frontend, e2e, twiggy}. lint/rust/py-*/wasm/
# iai stay independent (they consume no wasm artifact). Future cheap independent
# jobs — W5 cargo-audit, W1 proof:browser — slot in with no `needs:` (no lint-
# before-build gate: it would lengthen the build-lean-wasm critical path).
#
# Build posture (STANDING, per the T15 refutation — synthesis-pass3.md §1 #14):
# default release profile retained. NO lto=fat, NO codegen-units=1, NO strip
# anywhere in CI — the 10-25% claim was load-average-50 contention noise; on a
# quiet host lto=fat+cu=1+strip alone is +16-17% slower and the package nets ~=0%.
# The wheel lane (py-runtime) builds `maturin build --release` — the DEFAULT
# release profile, no extra tuning (T15 rejects lto=fat/cu=1/strip, not
# `--release` itself). A dev-profile wheel cannot clear the suite's <50ms
# solve-time assertions (test_bench_compare.py — ~102-112ms observed on a
# dev-profile Golden Nugget solve, W1 gate-py finding F2). Honest cost: the
# measured +36-40% cold cargo-build wall-time penalty (synthesis-pass3.md's
# release-profile cold-build note) now DOES apply to this lane's build step —
# accepted so the perf-threshold tests are meaningful instead of vacuous.
name: ci

on:
    pull_request:
        branches: [main, master]
    push:
        branches: [main, master]

jobs:
    # ---------------------------------------------------------------- Lane 1
    # fmt + clippy. Kept in a job of its own so a red clippy does NOT mask the
    # build/test/queens signal. Strict, no continue-on-error.
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: fmt
              run: cargo fmt --all --check
            - name: clippy (-D warnings, workspace, all targets)
              run: cargo clippy --workspace --all-targets -- -D warnings

    # ---------------------------------------------------------------- Lanes 2 + 3
    # build + test + queens-bench smoke. --workspace only, NEVER per-crate: the
    # wasm SolveConfig E0063 break was invisible to per-crate tests
    # (synthesis-pass3.md §1 T5 amendment 4).
    rust:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: build (workspace)
              run: cargo build --workspace
            - name: test (workspace)
              run: cargo test --workspace
            - name: queens-bench smoke (ground-truth solution-count asserts)
              # criterion --test mode runs each bench closure once, executing the
              # embedded assert_eq!(solutions.len(), 92 / 14200) checks that
              # `cargo test` structurally cannot see. The ONLY CI lane that sees
              # those assertions — guards the AC-3/MAC enumerate-continuation
              # soundness regression (kernel-soundness-closure.md §6). `-p csp-solver`
              # because the benches live in the csp-solver package.
              run: cargo bench -p csp-solver --bench queens -- --test
            - name: gac-ab bench smoke (GAC on/off closures run once)
              # The T3-W6 ROW-3a per-call-cost A/B bench, exercised in criterion
              # --test mode: runs each GAC on/off closure once and fires its
              # `assert!(!solutions.is_empty())` so a build that stops solving under
              # either GAC state fails here, not silently at measurement time.
              run: cargo bench -p csp-solver --bench gac_ab -- --test
            - name: GAC corpus node-count smoke (0/50 false-UNSAT + 40,513→4,678 spine)
              # T3-W6 ROW-3d: promotes examples/gac_ab_corpus from a hand-run probe
              # to a CI gate. Release build (the corpus is heavy — the hard 9×9 boards
              # dominate; a dev build would thrash the timeout). Two asserts, both
              # exit-non-zero: (a) zero false-UNSAT across GAC off AND on over the 50
              # known-solvable boards under the exact production config (Ac3+Mrv), and
              # (b) the deterministic search-node spine — GAC off→on totalling
              # 40,513→4,678 — holds. Node counts are a pure function of the algorithm
              # (invariant across machine + load, unlike the wall ratio, G6), so this
              # is the soundness+cost oracle guarding every future GAC edit. `-p
              # csp-solver` because the example lives in that package.
              run: cargo run -p csp-solver --release --example gac_ab_corpus

    # ---------------------------------------------------------------- Lane 4
    # py compile — the historical break class (Pass-1 N1). `cargo check --features py`
    # under Python 3.13: T2-W1's pyo3 0.24 -> 0.29 bump lifted the 0.24-era 3.13
    # ceiling (0.29 is tested through 3.14.0 final upstream) — 3.13 below is now a
    # tested-floor pin, not a hard cap (kernel-soundness-closure.md §7.6 is
    # superseded by the pyo3 0.29 migration note).
    py-compile:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - name: Pin Python 3.13 (pyo3 0.29-tested floor)
              id: setup-python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
            - name: Install Rust stable toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-pycompile-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: cargo check --features py
              # Point PyO3's build script at the pinned 3.13 interpreter explicitly
              # (fail-explicit: pin the tested floor rather than letting a stray host
              # Python get discovered — pyo3 0.29 itself now supports up to 3.14).
              env:
                  PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
              run: cargo check -p csp-solver --features py

    # ---------------------------------------------------------------- Lane 5
    # py runtime — the runtime gate for typed exceptions and GIL probes;
    # compile-check alone is insufficient (kernel-soundness-closure.md §7.6). Builds
    # the csp_solver wheel with maturin (config lives in csp-solver/pyproject.toml —
    # module csp_solver, features ["py"]), installs it into the csp-solver/tests-py
    # uv venv, runs pytest (carries the wheel-contract + panic-contract tests: unwind
    # -> PanicException catchable; forced abort -> SIGABRT negative control — self-
    # contained under csp-solver/tests-py, pytest.importorskip("csp_solver") + stdlib
    # only). `--release` (default release profile, no lto=fat/cu=1/
    # strip tuning — T15 only rejects that tuning, not `--release` itself; W1
    # py-closure gate finding F2: a dev-profile wheel fails the suite's <50ms
    # solve-time assertions, ~102-112ms observed on Golden Nugget). Accept the
    # measured +36-40% cold cargo-build wall-time penalty for this lane in
    # exchange for perf assertions that mean something.
    py-runtime:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - name: Pin Python 3.13 (pyo3 0.29-tested floor)
              id: setup-python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
            - name: Install Rust stable toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Install uv
              uses: astral-sh/setup-uv@v4
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-pyruntime-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: Stub auto-detection tripwire (module-name == stub stem)
              # maturin ships the stub + py.typed ONLY when the root
              # `<module-name>.pyi` stem equals `[tool.maturin] module-name`. A
              # rename of either silently drops both from the wheel with NO build
              # error — an untyped wheel ships green. Assert the invariant before
              # the build so the drop fails loud here (P2-L4 §5).
              run: |
                  mod=$(sed -nE 's/^module-name = "([^"]+)".*/\1/p' csp-solver/pyproject.toml)
                  test -f "csp-solver/${mod}.pyi" || {
                    echo "::error::stub csp-solver/${mod}.pyi missing — maturin would ship an untyped wheel"; exit 1;
                  }
                  echo "stub-stem OK: module-name='${mod}' == csp-solver/${mod}.pyi"
            - name: Build csp_solver wheel (maturin --release; default release profile, no extra tuning)
              # --interpreter + PYO3_PYTHON both pin the pinned 3.13 ABI explicitly.
              env:
                  PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
              run: |
                  # The cargo cache restores target/wheels/ with prior-version
                  # wheels; the install step's unqualified *.whl glob must match
                  # exactly one — clean before building (T3-W2 CI fix: 0.2.0 +
                  # 0.3.0 coexisting broke uv with conflicting URLs).
                  rm -rf target/wheels
                  uvx --from 'maturin>=1.0,<2.0' maturin build \
                    --release \
                    --manifest-path csp-solver/Cargo.toml \
                    --interpreter '${{ steps.setup-python.outputs.python-path }}' \
                    --out target/wheels
            - name: Sync test-harness venv (csp-solver/tests-py, dev extras)
              working-directory: csp-solver/tests-py
              # PEP 735 [dependency-groups]; uv installs the `dev` group by default —
              # plain sync is the correct invocation.
              run: uv sync
            - name: Install csp_solver wheel into the test-harness venv
              working-directory: csp-solver/tests-py
              run: uv pip install ../../target/wheels/*.whl
            - name: pytest (csp-solver/tests-py, against the installed wheel)
              # --no-sync so `uv run` does not re-resolve the venv and evict the
              # manually-installed csp_solver wheel (it isn't a declared dependency).
              working-directory: csp-solver/tests-py
              run: uv run --no-sync pytest
            - name: stubtest (csp_solver stub vs installed wheel, flag-free)
              # Flag-free (NOT --ignore-missing-stub) so surface GROWTH — a new
              # runtime class/function/exception the stub lacks — also fails loud;
              # the one-line stubtest_allowlist.txt suppresses ONLY maturin's
              # private `csp_solver.csp_solver` submodule. Expect: "Success: no
              # issues found in 2 modules". mypy>=1.11 rides the tests-py dev group.
              working-directory: csp-solver/tests-py
              run: uv run --no-sync python -m mypy.stubtest csp_solver --allowlist stubtest_allowlist.txt

    # ---------------------------------------------------------------- Lane 6
    # wasm — wasm-pack test --node on csp-solver/wasm (morph excised to its own
    # repo at W12; its wasm tests travel with it — morph-excision-spec.md
    # risks), plus clippy --target wasm32-unknown-unknown for BOTH wasm crates.
    wasm:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain (+ wasm32 target, clippy)
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
                  components: clippy
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            # The legacy installer script serves <0.14, which forwards --profile to
            # cargo alongside its implicit --release and dies — pin via taiki-e.
            - name: Install wasm-pack (>=0.14 floor — D9 three-file atomicity)
              uses: taiki-e/install-action@v2
              with:
                  tool: wasm-pack
            - name: wasm-pack test --node (csp-solver/wasm only)
              run: wasm-pack test --node csp-solver/wasm
            - name: clippy --target wasm32 (csp-solver-wasm)
              run: cargo clippy -p csp-solver-wasm --target wasm32-unknown-unknown -- -D warnings

    # ---------------------------------------------------------------- Lane 0
    # build-lean-wasm — the compute-cost DAG predecessor (T4-W2, r4). Builds the
    # LEAN deploy artifact ONCE with the EXACT ship recipe (byte-for-byte the same
    # command the frontend + e2e lanes each ran independently: `--target web
    # --profile wasm-release --no-default-features` — sudoku + futoshiki surface,
    # the assignment feature compiled out) and uploads `csp-solver/wasm/pkg` as
    # `lean-wasm-pkg`. frontend, e2e, and twiggy's lean half `needs:` this and
    # DOWNLOAD it instead of each rebuilding — killing 2 redundant lean builds and
    # the Rust toolchain + wasm-pack install in the (now Node-only) frontend + e2e
    # jobs. Framing is COMPUTE COST, not wall-time (r4): this serializes onto the
    # frontend/e2e/twiggy critical path, but the build is cheap and the duplicated
    # compute it removes is the win.
    build-lean-wasm:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain (wasm32)
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            - name: Install wasm-pack (>=0.14 floor)
              uses: taiki-e/install-action@v2
              with:
                  tool: wasm-pack
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-build-lean-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: Build the lean wasm artifact (EXACT ship recipe — the package.json file-link target)
              run: wasm-pack build csp-solver/wasm --scope mkbabb --target web --profile wasm-release --no-default-features
            - name: Upload the lean wasm pkg (shared by frontend + e2e + twiggy)
              uses: actions/upload-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: csp-solver/wasm/pkg
                  if-no-files-found: error
                  retention-days: 1

    # ---------------------------------------------------------------- Lane 7
    # twiggy budgets — measured artifact bands (Pass-2 prototype 6). Full module
    # FAIL >240 KB / WARN >230 KB on the raw .wasm (decimal KB, matching prototype
    # 6's "92,897 B raw ~= 93 KB" convention). The ~93 KB lean-sudoku budget is
    # enforced below on the --no-default-features build (sudoku + futoshiki only,
    # the assignment feature and its serde graph compiled out).
    twiggy:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        needs: [build-lean-wasm]
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain (+ wasm32 target)
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            - name: Cache cargo registry + target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-twiggy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: Install wasm-pack (>=0.14 floor — see the wasm job note)
              uses: taiki-e/install-action@v2
              with:
                  tool: wasm-pack
            - name: Install twiggy (binary cache)
              uses: taiki-e/install-action@v2
              with:
                  tool: twiggy
            # --profile wasm-release is REQUIRED: plain release yields
            # 270,179 B (over the 240 KB fail budget); wasm-release
            # (workspace-root profile, opt-level=z, panic=abort) yields
            # 222,436 B full / 90,602 B lean. Full is the T2-WGATE re-measure (the
            # W6 beat-9 propagate ops ride the full module too, +1,882 B): the
            # assignment Hungarian dispatch consumes the hungarian crate, whose
            # transitive ndarray grows the DEFAULT-feature full module +10,242 B;
            # the deployed lean artifact excludes assignment entirely. Lean 90,602 B
            # is the T2-W7 re-measure — +2,839 B over T2-W3's 87,763 B, from the W6
            # beat-9 ops. Prior:
            # 210,312 B full / 87,475 B lean (T2-W1 re-measure on stable +
            # wasm-bindgen 0.2.126, dtolnay/rust-toolchain@stable, this tree;
            # supersedes the W6 gate record of 211,639 B full / 87,853 B lean —
            # both bands hold with headroom, no rationale change needed).
            - name: wasm-pack build (full module)
              run: wasm-pack build csp-solver/wasm --scope mkbabb --profile wasm-release
            - name: twiggy top + raw-size budget (fail >240 KB / warn >230 KB)
              run: |
                  set -euo pipefail
                  WASM=csp-solver/wasm/pkg/csp_solver_wasm_bg.wasm
                  test -f "$WASM" || { echo "::error::$WASM not produced by wasm-pack build"; exit 1; }
                  twiggy top -n 25 "$WASM" || true
                  RAW=$(wc -c < "$WASM")
                  echo "full module raw size: ${RAW} B"
                  if [ "$RAW" -gt 240000 ]; then
                    echo "::error::wasm full module ${RAW} B exceeds the 240 KB fail budget"
                    exit 1
                  elif [ "$RAW" -gt 230000 ]; then
                    echo "::warning::wasm full module ${RAW} B exceeds the 230 KB warn threshold"
                  fi
            # Lean deploy artifact (W6): sudoku + futoshiki surface, the assignment
            # feature compiled out — the module the frontend Worker actually ships.
            # T4-W2 compute-cost DAG: DOWNLOAD the shared ship artifact (built once
            # in build-lean-wasm) instead of rebuilding the lean half here. It lands
            # in a distinct dir (lean-pkg/) so the full-module pkg measured above is
            # not clobbered.
            - name: Download the shared lean wasm pkg
              uses: actions/download-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: lean-pkg
            - name: lean raw-size budget (fail >93 KB)
              # Measures the EXACT ship artifact (`--target web` lean build, shared
              # from build-lean-wasm) — twiggy previously rebuilt the lean half on
              # the bundler-default target as a proxy; it now measures the bytes the
              # frontend actually ships. Band unchanged (measured 90,602 B; the
              # `--target web` delta is immaterial and the 93,000 B floor has headroom).
              run: |
                  set -euo pipefail
                  WASM=lean-pkg/csp_solver_wasm_bg.wasm
                  test -f "$WASM" || { echo "::error::$WASM missing from the lean-wasm-pkg artifact"; exit 1; }
                  RAW=$(wc -c < "$WASM")
                  echo "lean artifact raw size: ${RAW} B (measured 90,602 B; fail >93,000)"
                  if [ "$RAW" -gt 93000 ]; then
                    echo "::error::lean wasm artifact ${RAW} B exceeds the 93 KB band"
                    exit 1
                  fi

    # ---------------------------------------------------------------- Lane 8
    # frontend — npm ci --dry-run (EUSAGE was P0, Pass-2 prototype 8) then npm ci +
    # vue-tsc --noEmit + eslint boundary rig + knip. @mkbabb/csp-solver-wasm is a
    # monorepo file: link to the gitignored csp-solver/wasm/pkg build output (the
    # LEAN artifact — consuming the published full-featured registry package would
    # regress the 93 KB band). T4-W2 compute-cost DAG: instead of rebuilding that
    # artifact, this lane `needs:` build-lean-wasm and DOWNLOADS it — so there is no
    # Rust toolchain / wasm-pack / cargo cache here at all (the lane is Node-only).
    frontend:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [build-lean-wasm]
        steps:
            - uses: actions/checkout@v4
            - name: Download the lean wasm pkg (the package.json file-link target)
              uses: actions/download-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: csp-solver/wasm/pkg
            - name: Set up Node (LTS) with npm cache
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: web/frontend/package-lock.json
            # Node 24 ships npm 11.x already, but pin explicitly: older Node's npm 10
            # mis-resolves the lockfile.
            - name: Pin npm >=11
              run: npm install -g npm@^11
            - name: npm ci --dry-run (lockfile integrity gate)
              working-directory: web/frontend
              run: npm ci --dry-run
            - name: npm ci
              working-directory: web/frontend
              run: npm ci
            - name: vue-tsc --noEmit
              working-directory: web/frontend
              run: npx vue-tsc --noEmit
            # eslint — the colocation boundary rig (T4-W2, eslint.config.js):
            # pencil↮games, sudoku↮futoshiki, and the 3-level pencil-depth rule.
            # Wired here so a cross-boundary import reds the frontend lane (born-RED
            # proven: a src/pencil/** -> @games/** import trips no-restricted-imports).
            # Build output (dist*/) is ignored by the config so bundled JS never
            # enters the lint set.
            - name: eslint (colocation boundary rig)
              working-directory: web/frontend
              run: npm run lint:eslint
            # knip — the standing dead-file / dead-dependency / dead-EXPORT gate
            # (T3-W5 + T4-W2). files/dependencies AND exports/types now enforce at
            # `error` (knip.json) — dead exported surface reds the lane, not just a
            # warn census. The two pencil barrels stay on `entry` this wave; W4 drops
            # them off `entry` as it deletes the barrels into one deep-import grammar.
            - name: knip (dead-file / dead-dependency / dead-export gate)
              working-directory: web/frontend
              run: npm run lint:knip
            # prettier — the repo-pinned format gate (T4-W4, D2). `.prettierrc.json`
            # pins 2-space (matching eslint.config.js / vite.config.ts / tsconfig.json)
            # with the tailwind class-sorter live; `npm run lint` is now the
            # non-destructive `prettier --check src/`, retiring the machine-global
            # `~/.prettierrc` shadow that rewrote the tree to 4-space on a bare run.
            - name: prettier (repo-pinned format check)
              working-directory: web/frontend
              run: npm run lint

    # ---------------------------------------------------------------- Lane 9
    # e2e — Playwright over the Vue SPA (ratification R6). Node-only after the
    # T4-W2 compute-cost DAG: it `needs:` build-lean-wasm and DOWNLOADS the lean
    # @mkbabb/csp-solver-wasm pkg (the file: link target) rather than rebuilding it
    # — no Rust toolchain / wasm-pack / cargo cache here. It still pins npm >=11
    # (older Node's npm 10 mis-resolves the lockfile). playwright.config.ts's
    # webServer block spins `npm run dev` on :3000 for the run. The chromium
    # browser bundle is cached (keyed on the resolved Playwright version from the
    # lockfile) to keep CI-minutes cost down; the HTML report uploads on failure.
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        needs: [build-lean-wasm]
        steps:
            - uses: actions/checkout@v4
            - name: Download the lean wasm pkg (the package.json file-link target)
              uses: actions/download-artifact@v4
              with:
                  name: lean-wasm-pkg
                  path: csp-solver/wasm/pkg
            - name: Set up Node (LTS) with npm cache
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: web/frontend/package-lock.json
            # Node 24 ships npm 11.x already, but pin explicitly: older Node's npm 10
            # mis-resolves the lockfile.
            - name: Pin npm >=11
              run: npm install -g npm@^11
            - name: npm ci
              working-directory: web/frontend
              run: npm ci
            # Key the browser cache on the resolved Playwright version so a bump
            # invalidates it (the on-disk bundle layout is version-specific).
            - name: Resolve Playwright version (from the lockfile)
              id: pw-version
              working-directory: web/frontend
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
            - name: Cache Playwright browser bundle
              id: pw-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
            - name: "Install Playwright chromium (+ deps)"
              working-directory: web/frontend
              run: npx playwright install --with-deps chromium
            - name: "Run the Playwright e2e suite"
              working-directory: web/frontend
              run: npx playwright test
            # T4-W2 golden gate — the capture/compare/review system (visual-golden.spec.ts
            # vs committed e2e/goldens/*-linux.png crops) + the per-image byte ceiling.
            # Runs in this job to reuse the checkout/node_modules/chromium bundle
            # (compute-cost DAG: no redundant setup for a 4-test suite).
            - name: "Run the visual golden gate"
              working-directory: web/frontend
              run: npx playwright test --config playwright-golden.config.ts
            - name: "Golden byte ceiling"
              working-directory: web/frontend
              run: npm run test:golden:bytes
            # T4-W2 throttle gate — throttled-void against a BUNDLED preview build
            # (playwright-throttle.config.ts, port 4188); testIgnored from the default
            # config, so it must run explicitly or the D3 gate goes dark.
            - name: "Run the throttled-void gate (bundled preview)"
              working-directory: web/frontend
              run: npm run test:e2e:throttle
            # T4-W4 prod-shake proof (FAM-5): the DEV-gated FilterTuner /
            # rafInstrumentation / schedulerDebugInfo must be tree-shaken out of the
            # shipped bundle. Reuses dist-throttle/ (the bundled production build the
            # throttle gate just produced) — compute-cost DAG, no redundant build.
            - name: "Prod-shake proof (dev tuner absent from the bundle)"
              working-directory: web/frontend
              run: npm run test:prod-shake -- dist-throttle
            - name: Upload Playwright HTML report (failure only)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: web/frontend/playwright-report
                  retention-days: 7

    # ---------------------------------------------------------------- Lane 10
    # iai — instruction-count baseline gate for the solver hot path (P6 ADOPT,
    # Tranche-II Pass-2; re-founded T4-W2). arm64-macOS can't run Valgrind, so
    # callgrind counts are Linux/CI-only; `benches/iai_queens.rs` measures one
    # fully-deterministic 8-queens first-solution solve (AC-3 + FailFirst) under
    # callgrind. Instruction count is a pure function of the compiled binary.
    #
    # WHAT THIS GATES (and what it used to NOT gate): the prior lane ran the SAME
    # bench binary twice and asserted |I2-I1|/I1 < 1% — a determinism tautology.
    # run1 == run2 for any commit (identical binary => identical count), so the
    # delta was identically 0 and a 2x hot-path regression sailed green: the only
    # absolute baseline was never stored across commits, never compared. This lane
    # now runs the bench ONCE and diffs the measured count against a golden
    # committed at `csp-solver/benches/iai_queens.baseline`, failing outside a
    # +/-2% band (gate logic: `csp-solver/benches/iai_gate.sh`).
    #
    # SEARCH-TRAJECTORY / INSTRUCTION-COUNT LOCK: legitimate improvements must
    # re-baseline deliberately in a reviewed commit (edit iai_queens.baseline) —
    # this gate reds on a real speedup as loudly as on a regression, exactly like
    # the frozen search-node tripwire (gac_kernel_beats). No silent auto-update,
    # or it drifts back into the tautology it replaced.
    #
    # WHY +/-2%: on a pinned binary the count is exactly deterministic (P6: 3
    # runners, 0.000000% delta), but this lane rides `@stable`, whose rustc
    # codegen shifts release-to-release move this small kernel's count by well
    # under a percent; 2% clears that drift with headroom while a real
    # algorithmic regression (a doubled hot loop is +40..100%) fails by a wide
    # margin. Tighten the band (or pin the toolchain) when a shift proves it too
    # loose — that too is a reviewed re-baseline.
    #
    # Budget: Valgrind is apt-installed (~15 s) and iai-callgrind-runner is
    # cargo-install-cached in ~/.cargo/bin. Cache-cold the runner build dominates
    # (~2 min total); cache-warm the whole lane is ~40 s.
    #
    # CARGO_TERM_COLOR + IAI_CALLGRIND_COLOR are pinned to `never` for the WHOLE
    # job so no ANSI escape (the grey `\e[90m`) smuggles a bare "90" into the
    # numeric gate ahead of the real Instructions count (the P6 run-1/2 parser
    # bug). The gate ALSO ANSI-strips + anchors the digit-run to the
    # `Instructions:` label — belt and suspenders (folded from spike/iai-callgrind
    # ff5d9de3, "harden gate parser — strip ANSI, anchor to Instructions label").
    iai:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            RUST_BACKTRACE: 1
            IAI_BENCH: iai_queens
            IAI_CALLGRIND_COLOR: never
            CARGO_TERM_COLOR: never
            IAI_TOLERANCE_PCT: '2.0'
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust stable toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: "Install Valgrind (callgrind)"
              run: |
                  sudo apt-get update
                  sudo apt-get install -y valgrind
                  valgrind --version
            - name: Cache cargo registry + target (+ ~/.cargo/bin for the runner)
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ~/.cargo/bin
                      target
                  key: cargo-iai-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
            - name: "Install iai-callgrind-runner (must match the 0.16.1 dev-dep)"
              run: |
                  if ! command -v iai-callgrind-runner >/dev/null 2>&1; then
                    cargo install iai-callgrind-runner --version 0.16.1 --locked
                  fi
                  iai-callgrind-runner --version || true
            - name: "Run — measure the callgrind instruction count"
              run: |
                  set -o pipefail
                  cargo bench -p csp-solver --bench "$IAI_BENCH" 2>&1 | tee run.log
            - name: "GATE — diff measured count vs the committed golden (+/-2% band)"
              run: |
                  bash csp-solver/benches/iai_gate.sh \
                    run.log \
                    csp-solver/benches/iai_queens.baseline \
                    "$IAI_TOLERANCE_PCT"
            - name: "Upload log + baseline + callgrind out-files"
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: iai-evidence
                  path: |
                      run.log
                      csp-solver/benches/iai_queens.baseline
                      target/iai/**
                  if-no-files-found: warn

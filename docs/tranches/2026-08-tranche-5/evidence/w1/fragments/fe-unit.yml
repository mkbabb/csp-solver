# T5-W1.1 — CI job fragment: the FE unit lane joins CI.
#
# A STANDALONE SNIPPET, not a workflow. The integrator lane owns .github/workflows/ci.yml.
# The block below is written at column 0 so it parses on its own (a one-key mapping — that
# is how it was verified); ci.yml indents its job keys by 4, so the integrator indents the
# whole block by 4 when pasting it into `jobs:`. Merge-parse verified against ci.yml at
# f38c5130 — see `evidence/w1/fragment-merge-check.txt`. `gates.json` W1.unitLane pins the
# job name (`fe-unit`) and the floor (300).
#
# WHY THE LANE EXISTS (audit A1, CONFIRMED): 332 test blocks across 31 files, `test:unit`
# in package.json since T4-W2, and NOT ONE CI job invoked it. The whole FE unit estate was
# advisory. Verified at the wave base f38c5130 — `evidence/w1/unit-lane-local.txt`:
# 31 files / 332 tests / 133 suites, all passing, in 5.05s.
#
# WHY IT NEEDS build-lean-wasm: `@mkbabb/csp-solver-wasm` is a `file:../../csp-solver/wasm/pkg`
# dependency, so `npm ci` cannot resolve the tree until that directory exists. No unit imports
# the package (the four solver.worker.ts / useSolver.ts sites do, and no unit mounts them), but
# the install still needs the link target — so this lane DOWNLOADS the artifact the way
# `frontend` and `e2e` do rather than stubbing it. Node-only otherwise: no Rust toolchain,
# no wasm-pack, no cargo cache, no Playwright browsers.
#
# WHY THREE STEPS AND NOT ONE:
#   1. `--self-test` FIRST — the floor gate re-proves every one of its checks able to fail on
#      a known-bad input before CI trusts its green (the `lint:ink` house pattern). A gate
#      that cannot fail is not a gate, and this one guards a number nobody reads by hand.
#   2. `test:unit:report` — `vitest run` with the human reporter AND the JSON reporter. A red
#      test exits nonzero here; the log still reads like an ordinary vitest log.
#   3. `test:unit:count` — the count floor: >=300 tests EXECUTED (passed + failed; `.skip` and
#      `.todo` are NOT executed and never count). A narrowed `include`, a `describe.skip` over
#      a whole file, or a collection error that swallows the estate all exit 0 from step 2 with
#      a cheerful summary; only step 3 sees the number move. It also rejects a stale, red, or
#      forged report — see scripts/check-unit-count.mjs.
#
# CANARY (the defect was ABSENCE, so the gate lands with proof it CAN fail):
# `evidence/w1/canary/canary-red.spec.ts`, copied to `web/frontend/src/canary-red.test.ts` and
# run once at the wave base — vitest exit 1, gate exit 1, banked at `evidence/w1/unit-canary-RED.txt`
# (334 executed, 2 failed, `success=false`). The team lead pushes that file on the canary branch
# at seal so THIS job is observed red on the runner, and banks the run id.

fe-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-lean-wasm]
    steps:
        - uses: actions/checkout@v4
        - name: Download the lean wasm pkg (the package.json file-link target)
          uses: actions/download-artifact@v4
          with:
              name: lean-wasm-pkg
              path: csp-solver/wasm/pkg
        - name: Set up Node (LTS) with npm cache
          uses: actions/setup-node@v4
          with:
              node-version: '24'
              cache: npm
              cache-dependency-path: web/frontend/package-lock.json
        # Node 24 ships npm 11.x already, but pin explicitly: older Node's npm 10
        # mis-resolves the lockfile.
        - name: Pin npm >=11
          run: npm install -g npm@^11
        - name: npm ci
          working-directory: web/frontend
          run: npm ci
        # The gate, before the green it grades.
        - name: unit count gate self-test (every check shown able to fail)
          working-directory: web/frontend
          run: node scripts/check-unit-count.mjs --self-test
        # vitest run — human log + the JSON report step 3 reads (gitignored; regenerated by
        # the run it grades).
        - name: vitest run (FE unit estate)
          working-directory: web/frontend
          run: npm run test:unit:report
        # The count floor: >=300 EXECUTED. 332 at the wave base; 300 is ~10% below, so
        # ordinary churn doesn't red the lane while wholesale exclusion does. Re-derive the
        # floor from a fresh census, never nudge it down to meet a red.
        - name: unit count floor (>=300 executed)
          working-directory: web/frontend
          run: npm run test:unit:count
        # A red lane should hand back the census it red on, not just the console tail.
        - name: Upload the vitest JSON report (failure only)
          if: failure()
          uses: actions/upload-artifact@v4
          with:
              name: vitest-report
              path: web/frontend/vitest-report.json
              retention-days: 7

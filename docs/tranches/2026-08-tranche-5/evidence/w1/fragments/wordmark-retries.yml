# T5-W1 row 1.6 (B1 NARROWED) — CI fragment: the Playwright RETRIES POLICY lint.
#
# FOR THE INTEGRATOR LANE (this wave's sole owner of .github/workflows/ci.yml).
#
# WHERE: inside the existing `e2e:` job, in `steps:`, immediately AFTER row 1.10's
#            - name: 'Playwright project matrix (CH-56 — no silent single-engine narrowing)'
#              working-directory: web/frontend
#              run: npm run test:e2e:projects
#        (fragments/config-lint.yml), and BEFORE
#            - name: Resolve Playwright version (from the lockfile)
#        If 1.10's fragment is dropped, this one takes its slot: immediately after `npm ci`.
#
# WHY THERE: `check-pw-retries.mjs` imports the three Playwright config MODULES and reads
# nothing else. It launches no browser, needs no dist, no preview and no goldens, and finishes
# in well under a second — so it belongs upstream of the ~4-minute browser install, beside the
# sibling config lint it shares a subject with. It reuses the job's checkout + node_modules;
# it adds no `needs:`, no service, no cache key, no matrix leg.
#
# WHAT IT GATES (scripts/check-pw-retries.mjs, four checks + a canary per check):
#   1 THE LAW      — a config granting any retry must declare `failOnFlakyTests: true`.
#                    Before T5-W1 no config declared it while two projects carried retries:1,
#                    and run 30690204551 cashed that: wordmark-webkit's `sudoku` row red on
#                    attempt 1, green on attempt 2, reported flaky, lane exit 0.
#   2 THE CENSUS   — every non-zero retry is a NAMED grant carrying its class and its reason.
#                    An ungranted retry reds; a drifted value reds; a fossil grant reds.
#   3 THE REVOKED  — `wordmark-webkit` stays at retries 0 (the grant died with the linux
#                    vacuity yield this row hoisted the clip assertion out of).
#   4 NO OPT-OUT   — `failOnFlakyTests: false` is never declared by hand.
# The configs are read through their own `defineConfig` export, not by regex over the source:
# a comment cannot satisfy this gate and a reformat cannot break it.
#
# `--self-test` (carried by the npm script, so every CI run pays it) re-runs each check against
# a census built to violate it and fails if any check stays green — and re-runs all four
# against a healthy census, so a check that reds on everything cannot masquerade as alive.
#
# EXIT CODE is the whole contract: 0 green, 1 with every violation printed. No
# `continue-on-error`, no `|| true` — this job has none anywhere and this step adds none.
#
# NOTE FOR THE INTEGRATOR: this step gates the POLICY, not the suite. The suite half of row 1.6
# — the hoisted edge-clip verdict and the 5/5 theme-bake guard — rides the existing
# `npm run test:e2e:throttle` step with no CI change at all: same job, same config, same
# preview, 23 tests → 39 (theme-bake 4 → 20, the 1/5 → 5/5 widening). Measured wall on darwin
# webkit+chromium against a built dist: 27.0 s for all 39, 9 workers.

- name: 'Playwright retries policy (1.6 — a retried pass never greens a lane)'
  working-directory: web/frontend
  run: npm run test:e2e:retries

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BC5-G4 — encode threading</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f7f4ec;
      }
      canvas {
        display: none;
      }
    </style>
  </head>
  <body>
    <script>
      // ── BC5-G4 page ──────────────────────────────────────────────────────────────
      // Eight canvases at the real bake's real geometry, painted ONCE, encoded by three
      // different APIs. Nothing is painted inside a measurement window.
      //
      // GEOMETRY + BYTE TARGETS are the pass-5 measurement's own, not invented here:
      //   pass5/BC/runs/p5-shipped-dpr2.jsonl rep 1 —
      //     4 poses at 794x234  -> 24,171 / 24,285 / 24,347 / 24,448 B
      //     4 poses at 1320x1320 -> 197,395 / 197,440 / 198,011 / 198,692 B
      // The painter below is calibrated at load until its PNGs land in those bands, so the
      // encoder here is doing the shipped encoder's amount of work.

      const SHEETS = [
        { w: 794, h: 234, band: [22000, 27000] },
        { w: 794, h: 234, band: [22000, 27000] },
        { w: 794, h: 234, band: [22000, 27000] },
        { w: 794, h: 234, band: [22000, 27000] },
        { w: 1320, h: 1320, band: [188000, 208000] },
        { w: 1320, h: 1320, band: [188000, 208000] },
        { w: 1320, h: 1320, band: [188000, 208000] },
        { w: 1320, h: 1320, band: [188000, 208000] },
      ];

      /** mulberry32 — a seeded PRNG so every canvas is byte-reproducible across arms. */
      function rng(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /**
       * Paint one pose-shaped sheet: sparse dark strokes on transparent, the compression
       * profile of a hand-drawn filtered pose (mostly empty, high-entropy where it is not).
       * `strokes` is the calibration knob; `seed` keeps it deterministic.
       */
      function paint(ctx, w, h, strokes, seed) {
        const r = rng(seed);
        ctx.clearRect(0, 0, w, h);
        ctx.lineCap = "round";
        for (let i = 0; i < strokes; i++) {
          const x = r() * w;
          const y = r() * h;
          const len = 4 + r() * 26;
          const ang = r() * Math.PI * 2;
          ctx.strokeStyle = `rgba(${(30 + r() * 40) | 0},${(28 + r() * 36) | 0},${
            (26 + r() * 34) | 0
          },${0.35 + r() * 0.65})`;
          ctx.lineWidth = 0.6 + r() * 2.2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(
            x + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 6,
            y + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 6,
            x + Math.cos(ang) * len,
            y + Math.sin(ang) * len,
          );
          ctx.stroke();
        }
      }

      const toBlobP = (canvas) =>
        new Promise((res, rej) =>
          canvas.toBlob((b) => (b ? res(b) : rej(new Error("null encode"))), "image/png"),
        );

      /** FNV-1a over the blob bytes — the cross-arm pixel-identity guard. */
      async function hashBlob(blob) {
        const buf = new Uint8Array(await blob.arrayBuffer());
        let h = 0x811c9dc5;
        for (let i = 0; i < buf.length; i++) {
          h ^= buf[i];
          h = Math.imul(h, 0x01000193) >>> 0;
        }
        return h.toString(16).padStart(8, "0");
      }

      // ── the sampler: continuous rAF, windows cut at analysis ──────────────────────
      const FRAMES = [];
      let lastFrame = performance.now();
      (function tick(now) {
        FRAMES.push({ end: now, ms: now - lastFrame });
        lastFrame = now;
        requestAnimationFrame(tick);
      })(performance.now());

      function windowStats(t0, t1) {
        const inWin = FRAMES.filter((f) => f.end >= t0 && f.end <= t1 + 200);
        const big = inWin.filter((f) => f.ms >= 50);
        return {
          blockedMs: +big.reduce((s, f) => s + f.ms, 0).toFixed(1),
          worstGapMs: inWin.length ? +Math.max(...inWin.map((f) => f.ms)).toFixed(1) : null,
          longGaps100: inWin.filter((f) => f.ms >= 100).length,
          framesInWindow: inWin.length,
          medianGapMs: inWin.length
            ? +[...inWin.map((f) => f.ms)].sort((a, b) => a - b)[inWin.length >> 1].toFixed(1)
            : null,
        };
      }

      // ── build + calibrate ─────────────────────────────────────────────────────────
      const canvases = [];
      const calibration = [];

      async function build() {
        for (let i = 0; i < SHEETS.length; i++) {
          const { w, h, band } = SHEETS[i];
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          document.body.appendChild(c);
          const ctx = c.getContext("2d");
          // Bisect the stroke count until the PNG lands inside the pass-5 byte band. All of
          // this runs at load, never inside a measurement window.
          let lo = 50,
            hi = 60000,
            best = null;
          for (let step = 0; step < 14; step++) {
            const mid = Math.round((lo + hi) / 2);
            paint(ctx, w, h, mid, 1000 + i * 7);
            const bytes = (await toBlobP(c)).size;
            best = { strokes: mid, bytes };
            if (bytes < band[0]) lo = mid;
            else if (bytes > band[1]) hi = mid;
            else break;
          }
          paint(ctx, w, h, best.strokes, 1000 + i * 7);
          const bytes = (await toBlobP(c)).size;
          calibration.push({ i, w, h, strokes: best.strokes, bytes, band, inBand: bytes >= band[0] && bytes <= band[1] });
          canvases.push(c);
        }
      }

      // ── the worker arm ────────────────────────────────────────────────────────────
      const WORKER_SRC = `
        let sheets = [];
        self.onmessage = async (e) => {
          const m = e.data;
          if (m.kind === 'load') {
            sheets = m.bitmaps.map((bm) => {
              const oc = new OffscreenCanvas(bm.width, bm.height);
              oc.getContext('2d').drawImage(bm, 0, 0);
              bm.close();
              return oc;
            });
            self.postMessage({ kind: 'loaded', n: sheets.length });
            return;
          }
          if (m.kind === 'encode') {
            const blobs = await Promise.all(
              sheets.map((oc) => oc.convertToBlob({ type: 'image/png' })),
            );
            self.postMessage({ kind: 'blobs', blobs });
          }
        };
      `;
      let worker = null;
      let workerLoaded = false;

      async function ensureWorker() {
        if (workerLoaded) return;
        worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" })));
        const bitmaps = await Promise.all(canvases.map((c) => createImageBitmap(c)));
        await new Promise((res) => {
          worker.onmessage = (e) => e.data.kind === "loaded" && res();
          worker.postMessage({ kind: "load", bitmaps }, bitmaps);
        });
        workerLoaded = true;
      }

      /** Offscreen surfaces for the convertToBlob arm — populated OUTSIDE any window. */
      let offs = null;
      function ensureOffscreen() {
        if (offs) return;
        offs = canvases.map((c) => {
          const oc = new OffscreenCanvas(c.width, c.height);
          oc.getContext("2d").drawImage(c, 0, 0);
          return oc;
        });
      }

      // ── the provenance control ────────────────────────────────────────────────────
      // The shipped bake's canvases get their pixels from `drawImage(<img src=svg blob>)`,
      // not from 2D stroke calls. If WebKit's encoder pays differently for a surface filled
      // that way (a GPU readback, say), the arms above would not transfer to the real path.
      // This arm re-fills the SAME eight canvases from serialized SVG images, OUTSIDE the
      // window, then runs the toBlob arm on them. Its blocked-vs-toBlob delta is the answer.
      let svgFilled = false;
      async function fillFromSvg() {
        if (svgFilled) return;
        for (let i = 0; i < canvases.length; i++) {
          const c = canvases[i];
          // Re-serialize this canvas's own pixels through an SVG <image> wrapper, so the
          // pixels stay identical (the hash guard still holds) while the PAINT PATH becomes
          // the shipped one: blob URL -> <img> decode -> drawImage.
          const png = await toBlobP(c);
          const dataUrl = await new Promise((res) => {
            const fr = new FileReader();
            fr.onload = () => res(fr.result);
            fr.readAsDataURL(png);
          });
          const svg =
            `<svg xmlns="http://www.w3.org/2000/svg" width="${c.width}" height="${c.height}" ` +
            `viewBox="0 0 ${c.width} ${c.height}">` +
            `<image href="${dataUrl}" width="${c.width}" height="${c.height}"/></svg>`;
          const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
          const img = await new Promise((res, rej) => {
            const im = new Image();
            im.onload = () => res(im);
            im.onerror = () => rej(new Error("svg image failed"));
            im.src = url;
          });
          const ctx = c.getContext("2d");
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
        }
        svgFilled = true;
      }

      // ── the run ───────────────────────────────────────────────────────────────────
      window.__g4run = async function (arm) {
        if (arm === "toBlobSvg") await fillFromSvg();
        if (arm === "convertToBlob") ensureOffscreen();
        if (arm === "worker") await ensureWorker();
        // settle: let the sampler run clean for a beat before the window opens
        await new Promise((r) => setTimeout(r, 700));

        const t0 = performance.now();
        let blobs;
        if (arm === "toBlob" || arm === "toBlobSvg") {
          blobs = await Promise.all(canvases.map(toBlobP));
        } else if (arm === "convertToBlob") {
          blobs = await Promise.all(offs.map((oc) => oc.convertToBlob({ type: "image/png" })));
        } else if (arm === "worker") {
          blobs = await new Promise((res) => {
            worker.onmessage = (e) => e.data.kind === "blobs" && res(e.data.blobs);
            worker.postMessage({ kind: "encode" });
          });
        } else if (arm === "idle") {
          await new Promise((r) => setTimeout(r, 400));
          blobs = [];
        } else {
          throw new Error("unknown arm " + arm);
        }
        const t1 = performance.now();

        const hashes = await Promise.all(blobs.map(hashBlob));
        return {
          arm,
          wallMs: +(t1 - t0).toFixed(1),
          ...windowStats(t0, t1),
          n: blobs.length,
          totalBytes: blobs.reduce((s, b) => s + b.size, 0),
          sizes: blobs.map((b) => b.size),
          hash: hashes.join("."),
          calibration,
        };
      };

      build().then(() => {
        window.__g4ready = true;
      });
    </script>
  </body>
</html>

# Dev-only overlay — auto-loaded by a bare `docker compose up`; the explicit
# prod invocation (-f docker-compose.yml -f docker-compose.prod.yml) never
# sees this file. Keeps dev bind mounts/ports/HMR out of the committed prod
# defaults (Pass-1 G4: bind-mounting the host tree over image contents is the
# out-of-band-live-config failure mode).
services:
  backend:
    build:
      target: development
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./web/api/src:/app/src
      - ./web/api/pyproject.toml:/app/pyproject.toml
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173

  frontend:
    build:
      target: development
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./web/frontend/src:/app/src
      - ./web/frontend/index.html:/app/index.html
      - ./web/frontend/vite.config.ts:/app/vite.config.ts
    environment:
      - VITE_API_URL=http://backend:8000

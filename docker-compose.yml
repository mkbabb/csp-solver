# Base stack — prod-safe minimal. Dev-only mounts/ports/HMR live in
# docker-compose.override.yml (auto-loaded by a bare `docker compose up`,
# never loaded when -f files are given explicitly). Prod:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  backend:
    build:
      context: .
      dockerfile: web/api/Dockerfile
      target: production
    environment:
      # Ratified topology (W5-deploy-a): sudoku.babb.dev is the live frontend
      # origin. The legacy NCSU host is dead; do not reintroduce it.
      - CORS_ORIGINS=${CORS_ORIGINS:-https://sudoku.babb.dev}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  frontend:
    build:
      context: ./web/frontend
      target: production
      args:
        # Same-origin by default. The API origin's public hostname is an
        # owner action (OD-4/OD-5 DNS naming) — set via env, never guessed.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_BASE_URL: ${VITE_BASE_URL:-/}
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

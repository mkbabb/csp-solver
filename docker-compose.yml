services:
  backend:
    build:
      context: .
      dockerfile: web/api/Dockerfile
      target: development
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./web/api/src:/app/src
      - ./web/api/pyproject.toml:/app/pyproject.toml
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    networks:
      - app-network

  frontend:
    build:
      context: ./web/frontend
      target: development
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./web/frontend/src:/app/src
      - ./web/frontend/index.html:/app/index.html
      - ./web/frontend/vite.config.ts:/app/vite.config.ts
      - ./web/frontend/tailwind.config.ts:/app/tailwind.config.ts
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

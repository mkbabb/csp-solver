[project]
name = "sudoku-api"
version = "0.1.0"
description = "FastAPI service wrapping the Rust csp_solver engine (Sudoku; Futoshiki W10)"
authors = [{ name = "Mike Babb", email = "mike@babb.dev" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
]

# PEP 735 dependency groups. `uv sync` installs the `dev` group by default;
# `uv sync --no-dev` for a production image. The Rust `csp_solver` wheel is
# built + installed out-of-band via maturin (not a declared dependency here).
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Per-test wall-clock ceiling: the cancel/timeout/heartbeat wheel contracts
# run ~0.6-1.5 s each; a genuinely hung solve (missing GIL release, runaway
# search) must fail loud rather than wedge CI.
timeout = 120

[tool.mypy]
python_version = "3.13"
strict = true

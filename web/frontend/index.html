<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover (T4-WM lane C): opts the page into the notch/Dynamic-Island
         region so `env(safe-area-inset-*)` returns real insets — the fixed top-right
         celestial toggle pads clear of the notch (App.vue .corner-right). No
         `maximum-scale`/`user-scalable`: pinch-zoom stays intact (WCAG 1.4.4); the iOS
         focus-zoom is defeated structurally by the cells' 16px input font instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>sudoku</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- P5 (Tranche II): fonts are self-hosted woff2 subsets, wired via @font-face
         in src/assets/index.css — the Google Fonts CDN link is gone, so is the
         fonts.googleapis.com / fonts.gstatic.com CSP allowance (see public/_headers). -->
    <!-- Social unfurl (T4-W3): the same head serves all five games; the active game rides in
         the URL (?game=). og:image is a committed static card (public/og-card.png, landed by
         the design lane).
         M16 sweep: "CSP Solver", "constraint puzzles" and "permalink" are all gone — solver
         jargon and shop talk a player never asked for. The unfurl now says what you get and
         names the five, and the static <title> above matches the bare game name `App.vue`
         sets the live one to, so the tab reads the same before and after hydration. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="sudoku" />
    <meta
      property="og:description"
      content="five pencil puzzles: sudoku, futoshiki, thermo, killer, and kenken. play alone or with friends on a shared board."
    />
    <meta property="og:url" content="https://sudoku.babb.dev/" />
    <meta property="og:image" content="https://sudoku.babb.dev/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="sudoku" />
    <meta
      name="twitter:description"
      content="five pencil puzzles: sudoku, futoshiki, thermo, killer, and kenken. play alone or with friends on a shared board."
    />
    <meta name="twitter:image" content="https://sudoku.babb.dev/og-card.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

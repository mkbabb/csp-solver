limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # M5b security headers (Pass-1 M5b: confirmed absent at both nginx
    # layers — this reverse-proxy layer, and the frontend image's own
    # internal nginx). `always` so they land on error responses too, not
    # just 2xx/3xx. Server-level so both locations below inherit them
    # without repetition (a location that added its own add_header would
    # stop inheriting — neither does, so this is safe).
    #
    # This layer fronts backend + frontend on one origin (unlike the CF
    # Pages static-only deploy), so connect-src 'self' is a real working
    # same-origin API path here, not just a static-asset default. See
    # web/frontend/public/_headers for the directive-by-directive
    # rationale — this CSP mirrors that one for consistency across both
    # served paths.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Force HTTPS for 2y, cover subdomains. `preload` only marks eligibility
    # — actual submission to the HSTS preload list is a separate owner action.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # No legitimate embed/iframe use case — blocks clickjacking
    add_header X-Frame-Options "DENY" always;
    # Stop MIME-sniffing so a served asset can't be reinterpreted as a
    # different content-type
    add_header X-Content-Type-Options "nosniff" always;
    # Send only the origin cross-site, full URL same-site
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API routes → backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for solver requests
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Rate limiting (backup to slowapi)
        limit_req zone=api burst=20 nodelay;
    }

    # Everything else → frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

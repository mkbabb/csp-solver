services:
  backend:
    build:
      context: .
      dockerfile: web/api/Dockerfile
      target: production
    environment:
      # Ratified topology (W5-deploy-a): sudoku.babb.dev is the live frontend
      # origin. The legacy NCSU host (mbabb.fi.ncsu.edu) is dead; do not
      # reintroduce it as a fallback.
      - CORS_ORIGINS=${CORS_ORIGINS:-https://sudoku.babb.dev}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./web/frontend
      target: production
      args:
        # VITE_API_URL: same-origin by default (unset). The small always-on
        # API origin's hostname is an open owner action (OD-5, W5-deploy-a)
        # — set explicitly via env once that box is chosen; do not guess it
        # here.
        VITE_API_URL: ${VITE_API_URL:-}
        # sudoku.babb.dev serves from the apex, not a sub-path — /csp-solver/
        # was the legacy NCSU mount point.
        VITE_BASE_URL: ${VITE_BASE_URL:-/}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8120}:80"
    volumes:
      - ./web/nginx/sudoku.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

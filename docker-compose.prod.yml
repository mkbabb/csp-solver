# Prod overlay — committed, versioned prod defaults (Pass-1 G4 FAIL-EXPLICIT:
# no out-of-band-only live config). Base already carries production build
# targets, CORS default, and the backend healthcheck; this overlay adds
# restart policy, resource ceilings, log rotation, and the reverse proxy.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  backend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8120}:80"
    volumes:
      - ./web/nginx/sudoku.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: python/Dockerfile
      target: production
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://mbabb.fi.ncsu.edu}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_BASE_URL: ${VITE_BASE_URL:-/csp-solver/}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8120}:80"
    volumes:
      - ./nginx/sudoku.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

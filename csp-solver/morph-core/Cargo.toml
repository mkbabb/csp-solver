[package]
name = "morph-core"
version = "0.1.0"
edition = "2024"
description = "Form alignment and landmark matching primitives built on the csp-solver constraint engine."
license = "MIT"
repository = "https://github.com/mkbabb/csp-solver"

[dependencies]
csp-solver = { version = "0.1.0", path = ".." }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "align"
harness = false

[[bench]]
name = "primitives"
harness = false

[package]
name = "csp-solver-wasm"
version = "0.1.1"
edition = "2024"
description = "WebAssembly bindings for csp-solver — isomorphic mirror of the Python binding."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
csp-solver = { path = ".." }
wasm-bindgen = "0.2"
serde-wasm-bindgen = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
console_error_panic_hook = "0.1"
# Always-on: `sudoku.rs`'s typed BUDGET_EXCEEDED/INVALID_INPUT errors need
# js_sys::{Error, Reflect} to stamp a `.code` string onto a real JS `Error`
# (wasm-bindgen's own `JsError` only carries a `.message`). Tiny surface,
# already implied transitively by wasm-bindgen itself.
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
# `sudoku` (the flat-index client-solve surface) is always compiled — it is
# the deploy-fork artifact and carries no serde dependency.
# `full-mirror` = the generic Csp/SolveConfig/SolveStats mirror of py.rs.
# `assignment`  = the bipartite-assignment convenience binding (bbnf-buddy).
# The lean browser deploy build uses `--no-default-features`: sudoku only,
# with the whole serde-wasm-bindgen graph out of the compile.
default = ["full-mirror", "assignment"]
full-mirror = ["dep:serde-wasm-bindgen", "dep:serde"]
assignment = ["dep:serde-wasm-bindgen", "dep:serde"]

# wasm-pack applies these flags as its bundled wasm-opt size pass on the cdylib
# output; the parent crate's release profile is not perturbed by this tuning.
#
# The wasm-opt array is DUPLICATED under `.profile.release` and `.profile.custom`
# (Pass-2 D9, three-file atomicity): wasm-pack ≥0.14's `--profile <name>` keys the
# wasm-opt metadata to the literal `custom` table, while a plain `--release` build
# reads `.profile.release`. Duplicating guarantees neither invocation path silently
# drops `--enable-nontrapping-float-to-int`. Keep the two arrays identical.
#
# `--enable-nontrapping-float-to-int` is appended (free): it matches the codegen
# feature rustc emits and averts a wasm-opt validation failure on the saturating
# float→int conversions. NO `strip=true` in any cargo profile feeding these builds
# (see the workspace-root `[profile.wasm-release]`): strip deletes the
# `target_features` section and hard-breaks this `-Oz` pass — the D9 hazard.
#
# Floor: wasm-pack ≥ 0.14 (the `--profile` flag + the `custom` wasm-opt table).
# Older wasm-pack has no `--profile` and would ignore `.profile.custom` entirely.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

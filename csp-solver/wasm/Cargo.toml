[package]
name = "csp-solver-wasm"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for csp-solver — the sudoku, futoshiki, and assignment solve surfaces."
license = "MIT"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
csp-solver = { workspace = true }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true }
# Always-on: `sudoku.rs`'s typed BUDGET_EXCEEDED/INVALID_INPUT errors need
# js_sys::{Error, Reflect} to stamp a `.code` string onto a real JS `Error`
# (wasm-bindgen's own `JsError` only carries a `.message`). Tiny surface,
# already implied transitively by wasm-bindgen itself.
js-sys = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[features]
# `sudoku` + `futoshiki` (the flat-index client-solve surfaces) are always
# compiled — they are the deploy-fork artifact and carry no serde dependency.
# `assignment`  = the bipartite-assignment convenience binding (bbnf-buddy).
# The lean browser deploy build uses `--no-default-features`: sudoku +
# futoshiki only, with the whole serde-wasm-bindgen graph out of the compile.
default = ["assignment"]
assignment = ["dep:serde-wasm-bindgen", "dep:serde"]

# wasm-pack applies these flags as its bundled wasm-opt size pass on the cdylib;
# the parent crate's release profile is not perturbed. This ONE table is live.
#
# The name is load-bearing and counterintuitive: the ship recipe passes
# `--profile wasm-release`, which wasm-pack (≥0.14) classifies as a *custom* build
# profile — so its wasm-opt metadata resolves from the literal `.profile.custom`
# key, NOT from `.profile.release` (that one is read only by a plain
# `wasm-pack build --release`, an invocation nothing here uses). The former
# `.profile.release` twin was the DEAD duplicate and is removed; keeping THIS
# table is what holds the emitted cdylib byte-identical to the ship recipe
# (verified T4-W5: dropping `.profile.custom` regresses 86,734 B → 87,496 B,
# +762 B). Renaming/removing it is structurally impossible without changing the
# `--profile wasm-release` recipe across CI + the Makefile, so `custom` stays.
#
# `--enable-nontrapping-float-to-int` is appended (free): it matches the codegen
# feature rustc emits and averts a wasm-opt validation failure on the saturating
# float→int conversions. `--enable-bulk-memory` is RETIRED: rustc 1.97 enables
# bulk-memory in its default wasm32 target features, and dropping the wasm-opt
# flag is byte-neutral here (86,734 B unchanged — measured T4-W5). NO `strip=true`
# in any cargo profile feeding these builds (see the workspace-root
# `[profile.wasm-release]`): strip deletes the `target_features` section and
# hard-breaks this `-Oz` pass.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Oz", "--enable-nontrapping-float-to-int"]

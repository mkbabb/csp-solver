[package]
name = "csp-solver"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description = "Generic constraint satisfaction problem solver with backtracking, AC-3 constraint propagation, and ordering heuristics."
license = "MIT"
repository = "https://github.com/mkbabb/csp-solver"

[lints]
workspace = true

[features]
default = []
py = ["dep:pyo3"]
# abi3-py310: build a single forward-compatible wheel (cp310-abi3) against the
# stable CPython ABI, collapsing the per-version wheel matrix. Opt-in — a plain
# `--features py` build stays version-specific. Enables the limited-API surface
# only; the crate uses no version-specific pyo3 API (tranche-III R5 spike).
abi3 = ["py", "pyo3/abi3-py310"]

[dependencies]
# Compile-time embed of the crate-owned puzzle-template bank
# (`data/sudoku_puzzles/`) into the built artifact — see
# `puzzles/sudoku/generate.rs`. Pure-Rust, no C deps; wasm-compatible (the macro
# reads files on the host at build time, ships them as `&'static [u8]`).
include_dir = { workspace = true }
# Version + `extension-module` live in `[workspace.dependencies]`; this member is
# pyo3's sole consumer and adds only its `optional` gate (the `py` feature).
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
# iai-callgrind instruction-count baselines (`benches/iai_queens.rs`). Linux/CI
# only — Valgrind can't run on arm64-macOS, so `cargo bench --bench iai_queens`
# no-ops off CI. Pinned in lockstep with the `iai-callgrind-runner` the iai lane
# `cargo install`s in `.github/workflows/ci.yml`; bump both together. Left inline
# (not workspace-hoisted) since csp-solver is its sole consumer. See P6 (Tranche-II
# Pass-2) — deterministic across 3 ephemeral runners, 0.000000% delta.
iai-callgrind = "0.16.1"

[lib]
# cdylib only needed for PyO3 (maturin). Normal builds produce rlib only.
# maturin adds cdylib automatically via pyproject.toml.
crate-type = ["lib"]

[[bench]]
name = "sudoku"
harness = false

[[bench]]
name = "queens"
harness = false

[[bench]]
name = "map_coloring"
harness = false

[[bench]]
name = "lattice"
harness = false

[[bench]]
name = "assignment"
harness = false

[[bench]]
name = "cost_finite_domain"
harness = false

# iai-callgrind instruction-count bench (harness = false; driven by the
# iai-callgrind-runner binary, not libtest). Runs only under Linux/CI with
# Valgrind — the iai lane in `.github/workflows/ci.yml`.
[[bench]]
name = "iai_queens"
harness = false

[package]
name = "csp-solver"
version = "0.1.0"
edition = "2024"

[features]
default = []
py = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
hungarian = "1"

[lib]
# cdylib only needed for PyO3 (maturin). Normal builds produce rlib only.
# maturin adds cdylib automatically via pyproject.toml.
crate-type = ["lib"]

[[bench]]
name = "sudoku"
harness = false

[[bench]]
name = "queens"
harness = false

[[bench]]
name = "map_coloring"
harness = false

[[bench]]
name = "lattice"
harness = false

[[bench]]
name = "assignment"
harness = false

[[bench]]
name = "cost_finite_domain"
harness = false

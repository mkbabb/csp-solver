[package]
name = "csp-solver"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Generic constraint satisfaction problem solver with backtracking, AC-3 constraint propagation, and ordering heuristics."
license = "MIT"
repository = "https://github.com/mkbabb/csp-solver"

[lints]
workspace = true

[features]
default = []
py = ["dep:pyo3"]
# Gates `examples/alloc_count.rs`'s counting `#[global_allocator]`. Off by
# default so the example compiles under plain builds/`--all-targets` without
# claiming the process-wide global allocator slot — a future mimalloc
# `#[global_allocator]` (composed elsewhere, e.g. behind its own feature) would
# otherwise hard-conflict ("cannot define multiple global allocators") the
# moment both are in the same build graph. `--features alloc-count` restores
# the counting allocator for the alloc-count measurement harness.
alloc-count = []

[dependencies]
# Compile-time embed of the crate-owned puzzle-template bank
# (`data/sudoku_puzzles/`) into the built artifact — see
# `puzzles/sudoku/generate.rs`. Pure-Rust, no C deps; wasm-compatible (the macro
# reads files on the host at build time, ships them as `&'static [u8]`).
include_dir = { workspace = true }
# Version + `extension-module` live in `[workspace.dependencies]`; this member is
# pyo3's sole consumer and adds only its `optional` gate (the `py` feature).
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
hungarian = { workspace = true }
proptest = { workspace = true }

[lib]
# cdylib only needed for PyO3 (maturin). Normal builds produce rlib only.
# maturin adds cdylib automatically via pyproject.toml.
crate-type = ["lib"]

[[bench]]
name = "sudoku"
harness = false

[[bench]]
name = "queens"
harness = false

[[bench]]
name = "map_coloring"
harness = false

[[bench]]
name = "lattice"
harness = false

[[bench]]
name = "assignment"
harness = false

[[bench]]
name = "cost_finite_domain"
harness = false
